<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시작페이지</title>
    <style>
        :root {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --panel-bg: rgba(30, 30, 30, 0.75);
            --border-color: rgba(255, 255, 255, 0.1);
        }

        body.light-mode {
            --bg-color: #f4f4f4;
            --text-color: #222222;
            --panel-bg: rgba(255, 255, 255, 0.85);
            --border-color: rgba(0, 0, 0, 0.1);
        }

        body {
            margin: 0;
            padding: 40px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            box-sizing: border-box;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .top-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .theme-toggle {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            backdrop-filter: blur(10px);
        }

        .search-container {
            display: flex;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 8px 16px;
            backdrop-filter: blur(10px);
            align-items: center;
            max-width: 800px;
            margin: 0 auto 30px auto;
        }

        .search-container input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-color);
            font-size: 16px;
            outline: none;
        }

        .search-container button {
            background: transparent;
            border: none;
            color: var(--text-color);
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        .action-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            max-width: 800px;
            margin: 0 auto 40px auto;
        }

        .action-buttons button {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            backdrop-filter: blur(10px);
            transition: background 0.2s;
        }

        .action-buttons button:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* 대시보드 그리드 레이아웃 */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .widget-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            backdrop-filter: blur(10px);
            position: relative;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .widget-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            opacity: 0.7;
            margin-bottom: 10px;
        }

        .widget-delete {
            background: none;
            border: none;
            color: var(--text-color);
            cursor: pointer;
            font-size: 14px;
            opacity: 0.5;
        }
        .widget-delete:hover {
            opacity: 1;
        }

        /* 북마크 스타일 */
        .bookmark-content {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--text-color);
            flex: 1;
        }
        .bookmark-content img {
            width: 24px;
            height: 24px;
            border-radius: 4px;
        }
        .bookmark-title {
            font-size: 15px;
            font-weight: 500;
            word-break: break-all;
        }

        /* 메모 스타일 */
        .memo-content {
            background: transparent;
            border: none;
            color: var(--text-color);
            width: 100%;
            height: 100px;
            resize: none;
            outline: none;
            font-family: inherit;
            font-size: 14px;
        }

        /* 날씨 스타일 */
        .weather-content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            flex: 1;
            text-align: center;
        }
        .weather-temp {
            font-size: 28px;
            font-weight: bold;
            margin: 5px 0;
        }

        /* 모달 팝업 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal.active {
            display: flex;
        }
        .modal-box {
            background: #1e1e1e;
            border: 1px solid var(--border-color);
            padding: 24px;
            border-radius: 14px;
            width: 320px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .modal-box input {
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            outline: none;
            font-size: 14px;
        }
        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
        .modal-buttons button {
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            border: none;
            font-weight: 600;
        }
        .btn-cancel { background: #444; color: #fff; }
        .btn-submit { background: #fff; color: #000; }
    </style>
</head>
<body>

    <div class="top-bar">
        <button class="theme-toggle" onclick="toggleTheme()">바탕화면 색상</button>
    </div>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="구글 검색..." onkeypress="handleSearch(event)">
        <button onclick="performSearch()">검색</button>
    </div>

    <div class="action-buttons">
        <button onclick="openBookmarkModal()">+ 북마크</button>
        <button onclick="addMemoWidget()">+ 메모</button>
        <button onclick="addWeatherWidget()">+ 날씨</button>
    </div>

    <!-- 대시보드 위젯 영역 -->
    <div class="dashboard-grid" id="dashboardGrid"></div>

    <!-- 북마크 추가 모달 -->
    <div class="modal" id="bookmarkModal">
        <div class="modal-box">
            <h3>북마크 추가</h3>
            <input type="text" id="bookmarkUrlInput" placeholder="URL 입력 (예: https://naver.com)">
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeBookmarkModal()">취소</button>
                <button class="btn-submit" onclick="saveBookmark()">추가</button>
            </div>
        </div>
    </div>

    <script>
        let widgets = JSON.parse(localStorage.getItem('dashboard_widgets')) || [];

        function renderWidgets() {
            const grid = document.getElementById('dashboardGrid');
            grid.innerHTML = '';

            widgets.forEach((widget, index) => {
                const card = document.createElement('div');
                card.className = 'widget-card';

                if (widget.type === 'bookmark') {
                    card.innerHTML = `
                        <div class="widget-header">
                            <span>BOOKMARK</span>
                            <button class="widget-delete" onclick="deleteWidget(${index})">×</button>
                        </div>
                        <a href="${widget.url}" target="_blank" class="bookmark-content">
                            <img src="https://www.google.com/s2/favicons?domain=${widget.url}&sz=64" onerror="this.src='https://via.placeholder.com/24'">
                            <div class="bookmark-title">${widget.title || widget.url}</div>
                        </a>
                    `;
                } else if (widget.type === 'memo') {
                    card.innerHTML = `
                        <div class="widget-header">
                            <span>MEMO</span>
                            <button class="widget-delete" onclick="deleteWidget(${index})">×</button>
                        </div>
                        <textarea class="memo-content" oninput="updateMemo(${index}, this.value)">${widget.content || ''}</textarea>
                    `;
                } else if (widget.type === 'weather') {
                    card.innerHTML = `
                        <div class="widget-header">
                            <span>WEATHER (${widget.city || 'Busan'})</span>
                            <button class="widget-delete" onclick="deleteWidget(${index})">×</button>
                        </div>
                        <div class="weather-content">
                            <div class="weather-temp">${widget.temp || '--°C'}</div>
                            <div style="font-size: 13px; opacity: 0.8;">${widget.condition || '불러오는 중...'}</div>
                        </div>
                    `;
                }
                grid.appendChild(card);
            });
            localStorage.setItem('dashboard_widgets', JSON.stringify(widgets));
        }

        // 검색 기능
        function handleSearch(e) {
            if (e.key === 'Enter') performSearch();
        }
        function performSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (query) {
                window.location.href = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
            }
        }

        // 테마 토글
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            localStorage.setItem('theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
        }
        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light-mode');
        }

        // 북마크 모달 제어
        function openBookmarkModal() {
            document.getElementById('bookmarkModal').classList.add('active');
            document.getElementById('bookmarkUrlInput').value = '';
        }
        function closeBookmarkModal() {
            document.getElementById('bookmarkModal').classList.remove('active');
        }

        function saveBookmark() {
            let url = document.getElementById('bookmarkUrlInput').value.trim();
            if (!url) return;
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }

            try {
                const parsedUrl = new URL(url);
                let title = parsedUrl.hostname.replace('www.', '');
                widgets.push({ type: 'bookmark', url: url, title: title });
                renderWidgets();
                closeBookmarkModal();
            } catch (e) {
                alert('올바른 URL 형식이 아닙니다.');
            }
        }

        // 메모 추가
        function addMemoWidget() {
            widgets.push({ type: 'memo', content: '' });
            renderWidgets();
        }

        function updateMemo(index, value) {
            widgets[index].content = value;
            localStorage.setItem('dashboard_widgets', JSON.stringify(widgets));
        }

        // 날씨 추가 (wttr.in 무료 API 활용 - API 키 불필요)
        async function addWeatherWidget() {
            const index = widgets.length;
            widgets.push({ type: 'weather', city: 'Busan', temp: '--°C', condition: '로딩 중...' });
            renderWidgets();

            try {
                const res = await fetch('https://wttr.in/?format=j1');
                const data = await res.json();
                const current = data.current_condition[0];
                const temp = current.temp_C + '°C';
                const condition = current.weatherDesc[0].value;

                widgets[index].temp = temp;
                widgets[index].condition = condition;
                renderWidgets();
            } catch (err) {
                widgets[index].condition = '날씨 정보 실패';
                renderWidgets();
            }
        }

        function deleteWidget(index) {
            widgets.splice(index, 1);
            renderWidgets();
        }

        // 초기 렌더링
        renderWidgets();
    </script>
</body>
</html>
