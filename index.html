<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>시작페이지</title>
  <style>
    :root {
      --bg: #222429;
      --card-bg: #2d3037;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f0f1f5;
      --muted: #9ba1b0;
      --accent: #ffffff;
      --danger: #ff5555;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      padding: 40px 24px;
      max-width: 1100px;
      margin: 0 auto;
      transition: background-color 0.3s ease;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 28px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .date-time { font-size: 0.85rem; color: var(--muted); }
    .clock { font-size: 2.2rem; font-weight: 700; color: var(--accent); letter-spacing: -0.02em; }
    
    .theme-picker {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--muted);
      background: var(--card-bg);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
    }
    .theme-picker input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      cursor: pointer;
      background: none;
    }
    .theme-picker input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    .theme-picker input[type="color"]::-webkit-color-swatch { border: 1px solid rgba(255,255,255,0.2); border-radius: 50%; }

    .search-box {
      margin-bottom: 24px;
      display: flex;
      gap: 10px;
    }
    .search-box input {
      flex: 1;
      padding: 12px 18px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
    }
    .search-box button {
      padding: 0 20px;
      border-radius: 12px;
      border: none;
      background: var(--accent);
      color: #111;
      font-weight: 600;
      cursor: pointer;
    }

    .controls {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-bottom: 24px;
    }
    .btn-add {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: background 0.2s;
    }
    .btn-add:hover { background: rgba(255,255,255,0.1); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }
    
    /* 카드 디자인: 둥근 모서리 + 얇은 테두리 */
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      transition: transform 0.2s ease, background-color 0.3s ease;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-title {
      font-size: 1rem;
      font-weight: 600;
      border: none;
      background: transparent;
      color: var(--text);
      outline: none;
      width: 70%;
    }
    .card-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-color-picker {
      -webkit-appearance: none;
      border: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      cursor: pointer;
      background: none;
    }
    .card-color-picker::-webkit-color-swatch-wrapper { padding: 0; }
    .card-color-picker::-webkit-color-swatch { border: 1px solid rgba(255,255,255,0.3); border-radius: 50%; }

    .btn-del {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 1rem;
    }
    .btn-del:hover { color: var(--danger); }

    .bookmark-input {
      display: flex;
      gap: 8px;
    }
    .bookmark-input input {
      flex: 1;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(0,0,0,0.2);
      color: var(--text);
      font-size: 0.85rem;
    }
    .bookmark-list { list-style: none; display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
    .bookmark-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .bookmark-item a { color: #a5b4fc; text-decoration: none; font-size: 0.9rem; }
    .bookmark-item a:hover { text-decoration: underline; }

    textarea.note-content {
      width: 100%;
      height: 110px;
      background: rgba(0,0,0,0.2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 10px;
      resize: vertical;
      outline: none;
      font-family: inherit;
      font-size: 0.9rem;
    }

    /* 날씨 위젯 */
    .weather-info {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 8px 0;
    }
    .weather-temp { font-size: 2.2rem; font-weight: 700; }
    .weather-desc { color: var(--muted); font-size: 0.9rem; }
  </style>
</head>
<body>

  <header>
    <div>
      <div id="date" class="date-time"></div>
      <div id="clock" class="clock">00:00</div>
    </div>
    <div class="theme-picker">
      <span>바탕화면 색상</span>
      <input type="color" id="bg-picker" value="#222429">
    </div>
  </header>

  <form class="search-box" action="https://www.google.com/search" method="GET" target="_blank">
    <input type="text" name="q" placeholder="구글 검색..." required>
    <button type="submit">검색</button>
  </form>

  <div class="controls">
    <button class="btn-add" id="btn-add-bm">+ 북마크</button>
    <button class="btn-add" id="btn-add-note">+ 메모</button>
    <button class="btn-add" id="btn-add-weather">+ 날씨</button>
  </div>

  <div id="grid" class="grid"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, updateDoc, arrayUnion, arrayRemove 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAagWKtXuvQOhV-__Mxmd5ys8vs0xDDCUs",
      authDomain: "water-log132.firebaseapp.com",
      projectId: "water-log132",
      storageBucket: "water-log132.firebasestorage.app",
      messagingSenderId: "569667354916",
      appId: "1:569667354916:web:f9c9b9a028e81f53f7f3b1",
      measurementId: "G-YDQ38GTXP3"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const cardsCol = collection(db, "startpage_widgets");

    // 배경색 팔레트 이벤트 (Localstorage 저장)
    const bgPicker = document.getElementById('bg-picker');
    const savedBg = localStorage.getItem('custom_bg_color');
    if (savedBg) {
      document.body.style.backgroundColor = savedBg;
      bgPicker.value = savedBg;
    }
    bgPicker.addEventListener('input', (e) => {
      const color = e.target.value;
      document.body.style.backgroundColor = color;
      localStorage.setItem('custom_bg_color', color);
    });

    function updateClock() {
      const now = new Date();
      const options = { month: 'long', day: 'numeric', weekday: 'short' };
      document.getElementById('date').innerText = now.toLocaleDateString('ko-KR', options);
      document.getElementById('clock').innerText = now.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: false });
    }
    setInterval(updateClock, 1000);
    updateClock();

    document.getElementById('btn-add-bm').addEventListener('click', () => addCard('bookmark'));
    document.getElementById('btn-add-note').addEventListener('click', () => addCard('note'));
    document.getElementById('btn-add-weather').addEventListener('click', () => addCard('weather'));

    async function addCard(type) {
      await addDoc(cardsCol, {
        type,
        title: type === 'bookmark' ? '북마크' : type === 'note' ? '메모' : '날씨',
        items: [],
        content: type === 'weather' ? 'Busan' : '',
        cardBg: '#2d3037',
        createdAt: Date.now()
      });
    }

    onSnapshot(cardsCol, (snapshot) => {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      snapshot.docs.forEach(docSnap => {
        grid.appendChild(renderCard(docSnap.id, docSnap.data()));
      });
    });

    function renderCard(id, data) {
      const card = document.createElement('div');
      card.className = 'card';
      if (data.cardBg) card.style.backgroundColor = data.cardBg;
      
      const headerHtml = `
        <div class="card-header">
          <input class="card-title" value="${data.title || ''}" placeholder="제목 입력">
          <div class="card-actions">
            <input type="color" class="card-color-picker" value="${data.cardBg || '#2d3037'}" title="위젯 색상 변경">
            <button class="btn-del" data-del-card="${id}">✕</button>
          </div>
        </div>
      `;

      let bodyHtml = '';
      if (data.type === 'bookmark') {
        const items = data.items || [];
        bodyHtml = `
          <div class="bookmark-input">
            <input type="text" id="input-${id}" placeholder="https://naver.com">
            <button class="btn-add" data-add-bm="${id}">추가</button>
          </div>
          <ul class="bookmark-list">
            ${items.map((item) => `
              <li class="bookmark-item">
                <a href="${item.url}" target="_blank">${item.title}</a>
                <button class="btn-del" data-del-bm-id="${id}" data-title="${item.title}" data-url="${item.url}">✕</button>
              </li>
            `).join('')}
          </ul>
        `;
      } else if (data.type === 'note') {
        bodyHtml = `<textarea class="note-content" placeholder="메모를 적어보세요...">${data.content || ''}</textarea>`;
      } else if (data.type === 'weather') {
        bodyHtml = `
          <div class="bookmark-input">
            <input type="text" id="city-${id}" value="${data.content || 'Busan'}" placeholder="도시 이름 (예: Seoul, Busan)">
            <button class="btn-add" data-update-weather="${id}">조회</button>
          </div>
          <div class="weather-info" id="w-info-${id}">
            <div class="weather-temp">--°C</div>
            <div class="weather-desc">날씨 정보 불러오는 중...</div>
          </div>
        `;
        fetchWeather(data.content || 'Busan', id);
      }

      card.innerHTML = headerHtml + bodyHtml;

      // 색상 커스텀 연동
      const colorPicker = card.querySelector('.card-color-picker');
      colorPicker.addEventListener('change', (e) => {
        updateDoc(doc(db, "startpage_widgets", id), { cardBg: e.target.value });
      });

      // 제목 변경
      const titleInput = card.querySelector('.card-title');
      titleInput.addEventListener('change', (e) => {
        updateDoc(doc(db, "startpage_widgets", id), { title: e.target.value });
      });

      // 위젯 삭제
      card.querySelector('[data-del-card]').addEventListener('click', () => {
        deleteDoc(doc(db, "startpage_widgets", id));
      });

      if (data.type === 'bookmark') {
        const addBtn = card.querySelector(`[data-add-bm="${id}"]`);
        const urlInput = card.querySelector(`#input-${id}`);
        const handleAdd = async () => {
          let url = urlInput.value.trim();
          if (!url) return;
          if (!url.startsWith('http://') && !url.startsWith('https://')) url = 'https://' + url;
          let title = url;
          try { title = new URL(url).hostname.replace('www.', ''); } catch (e) {}
          await updateDoc(doc(db, "startpage_widgets", id), { items: arrayUnion({ title, url }) });
          urlInput.value = '';
        };
        addBtn.addEventListener('click', handleAdd);
        urlInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleAdd(); });

        card.querySelectorAll('[data-del-bm-id]').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            await updateDoc(doc(db, "startpage_widgets", id), {
              items: arrayRemove({ title: e.target.getAttribute('data-title'), url: e.target.getAttribute('data-url') })
            });
          });
        });
      } else if (data.type === 'note') {
        card.querySelector('.note-content').addEventListener('change', (e) => {
          updateDoc(doc(db, "startpage_widgets", id), { content: e.target.value });
        });
      } else if (data.type === 'weather') {
        const weatherBtn = card.querySelector(`[data-update-weather="${id}"]`);
        weatherBtn.addEventListener('click', () => {
          const city = card.querySelector(`#city-${id}`).value.trim();
          if (city) {
            updateDoc(doc(db, "startpage_widgets", id), { content: city });
            fetchWeather(city, id);
          }
        });
      }

      return card;
    }

    // 날씨 정보 API
    async function fetchWeather(city, id) {
      try {
        const res = await fetch(`https://wttr.in/${encodeURIComponent(city)}?format=j1`);
        const data = await res.json();
        const current = data.current_condition[0];
        const temp = current.temp_C;
        const desc = current.lang_kr ? current.lang_kr[0].value : current.weatherDesc[0].value;
        
        const container = document.getElementById(`w-info-${id}`);
        if (container) {
          container.innerHTML = `
            <div class="weather-temp">${temp}°C</div>
            <div class="weather-desc">${city} · ${desc}</div>
          `;
        }
      } catch (e) {
        const container = document.getElementById(`w-info-${id}`);
        if (container) container.innerHTML = `<div class="weather-desc">날씨 정보를 가져올 수 없습니다.</div>`;
      }
    }
  </script>
</body>
</html>
