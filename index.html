<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>시작페이지</title>
  <style>
    :root {
      --bg: #0f0f11;
      --card-bg: #18181c;
      --border: #27272a;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --accent: #e4e4e7;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 40px 24px;
      max-width: 1100px;
      margin: 0 auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 32px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    .date-time { font-size: 0.85rem; color: var(--muted); }
    .clock { font-size: 2.2rem; font-weight: 700; color: var(--accent); }
    
    .search-box {
      margin-bottom: 28px;
      display: flex;
      gap: 10px;
    }
    .search-box input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
    }
    .search-box button {
      padding: 0 20px;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: #000;
      font-weight: 600;
      cursor: pointer;
    }

    .controls {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-bottom: 24px;
    }
    .btn-add {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .btn-add:hover { background: var(--border); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-title {
      font-size: 1rem;
      font-weight: 600;
      border: none;
      background: transparent;
      color: var(--text);
      outline: none;
      width: 80%;
    }
    .btn-del {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 1.1rem;
    }
    .btn-del:hover { color: var(--danger); }

    .bookmark-input {
      display: flex;
      gap: 8px;
    }
    .bookmark-input input {
      flex: 1;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.85rem;
    }
    .bookmark-list { list-style: none; display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    .bookmark-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid #222226;
    }
    .bookmark-item a { color: #a5b4fc; text-decoration: none; font-size: 0.9rem; }
    .bookmark-item a:hover { text-decoration: underline; }

    textarea.note-content {
      width: 100%;
      height: 120px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 10px;
      resize: vertical;
      outline: none;
      font-family: inherit;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <div id="date" class="date-time"></div>
      <div id="clock" class="clock">00:00</div>
    </div>
  </header>

  <form class="search-box" action="https://www.google.com/search" method="GET" target="_blank">
    <input type="text" name="q" placeholder="구글 검색..." required>
    <button type="submit">검색</button>
  </form>

  <div class="controls">
    <button class="btn-add" id="btn-add-bm">+ 북마크 추가</button>
    <button class="btn-add" id="btn-add-note">+ 메모 추가</button>
  </div>

  <div id="grid" class="grid"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, updateDoc, arrayUnion, arrayRemove 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAagWKtXuvQOhV-__Mxmd5ys8vs0xDDCUs",
      authDomain: "water-log132.firebaseapp.com",
      projectId: "water-log132",
      storageBucket: "water-log132.firebasestorage.app",
      messagingSenderId: "569667354916",
      appId: "1:569667354916:web:f9c9b9a028e81f53f7f3b1",
      measurementId: "G-YDQ38GTXP3"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const cardsCol = collection(db, "startpage_widgets");

    function updateClock() {
      const now = new Date();
      const options = { month: 'long', day: 'numeric', weekday: 'short' };
      document.getElementById('date').innerText = now.toLocaleDateString('ko-KR', options);
      document.getElementById('clock').innerText = now.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: false });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 상단 버튼 이벤트
    document.getElementById('btn-add-bm').addEventListener('click', () => addCard('bookmark'));
    document.getElementById('btn-add-note').addEventListener('click', () => addCard('note'));

    async function addCard(type) {
      await addDoc(cardsCol, {
        type,
        title: type === 'bookmark' ? '북마크' : '메모',
        items: [],
        content: '',
        createdAt: Date.now()
      });
    }

    // 실시간 동기화
    onSnapshot(cardsCol, (snapshot) => {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';

      snapshot.docs.forEach(docSnap => {
        const item = docSnap.data();
        const id = docSnap.id;
        grid.appendChild(renderCard(id, item));
      });
    });

    function renderCard(id, data) {
      const card = document.createElement('div');
      card.className = 'card';
      
      const headerHtml = `
        <div class="card-header">
          <input class="card-title" value="${data.title || ''}" data-id="${id}" placeholder="제목 입력">
          <button class="btn-del" data-del-card="${id}">✕</button>
        </div>
      `;

      let bodyHtml = '';
      if (data.type === 'bookmark') {
        const items = data.items || [];
        bodyHtml = `
          <div class="bookmark-input">
            <input type="text" id="input-${id}" placeholder="https://naver.com 입력">
            <button class="btn-add" data-add-bm="${id}">추가</button>
          </div>
          <ul class="bookmark-list">
            ${items.map((item) => `
              <li class="bookmark-item">
                <a href="${item.url}" target="_blank">${item.title}</a>
                <button class="btn-del" data-del-bm-id="${id}" data-title="${item.title}" data-url="${item.url}">✕</button>
              </li>
            `).join('')}
          </ul>
        `;
      } else {
        bodyHtml = `
          <textarea class="note-content" data-note-id="${id}" placeholder="메모를 적어보세요...">${data.content || ''}</textarea>
        `;
      }

      card.innerHTML = headerHtml + bodyHtml;

      // 이벤트 바인딩
      const titleInput = card.querySelector('.card-title');
      titleInput.addEventListener('change', (e) => {
        updateDoc(doc(db, "startpage_widgets", id), { title: e.target.value });
      });

      const cardDelBtn = card.querySelector('[data-del-card]');
      cardDelBtn.addEventListener('click', () => {
        deleteDoc(doc(db, "startpage_widgets", id));
      });

      if (data.type === 'bookmark') {
        const addBtn = card.querySelector(`[data-add-bm="${id}"]`);
        const urlInput = card.querySelector(`#input-${id}`);

        const handleAdd = async () => {
          let url = urlInput.value.trim();
          if (!url) return;
          if (!url.startsWith('http://') && !url.startsWith('https://')) url = 'https://' + url;

          let title = url;
          try {
            title = new URL(url).hostname.replace('www.', '');
          } catch (e) {}

          await updateDoc(doc(db, "startpage_widgets", id), {
            items: arrayUnion({ title, url })
          });
          urlInput.value = '';
        };

        addBtn.addEventListener('click', handleAdd);
        urlInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') handleAdd();
        });

        card.querySelectorAll('[data-del-bm-id]').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            const bTitle = e.target.getAttribute('data-title');
            const bUrl = e.target.getAttribute('data-url');
            await updateDoc(doc(db, "startpage_widgets", id), {
              items: arrayRemove({ title: bTitle, url: bUrl })
            });
          });
        });
      } else {
        const textarea = card.querySelector('.note-content');
        textarea.addEventListener('change', (e) => {
          updateDoc(doc(db, "startpage_widgets", id), { content: e.target.value });
        });
      }

      return card;
    }
  </script>
</body>
</html>
