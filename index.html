<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookmark Dashboard</title>
  <style>
    /* 전체 기본 리셋 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f2f2f2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 40px;
      color: #111;
    }

    /* 상단 헤더 & 버튼 영역 */
    .header {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 40px;
    }

    .nav-buttons {
      display: flex;
      gap: 12px;
    }

    .nav-buttons button,
    .theme-btn {
      background-color: #ffffff;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      color: #111;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
      transition: transform 0.1s ease;
    }

    .nav-buttons button:hover,
    .theme-btn:hover {
      transform: translateY(-1px);
    }

    .theme-btn {
      position: absolute;
      right: 0;
      top: 0;
    }

    /* 메인 대시보드 그리드 */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
      align-items: start;
    }

    /* 공통 카드 기본 구조 */
    .card {
      background-color: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
      overflow: hidden;
    }

    /* 텍스트/아이콘 카드 (상단 밀착 + 높이 유지) */
    .card.text-card {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: flex-start;
      padding: 28px;
      min-height: 280px;
    }

    .card-content {
      font-size: 20px;
      font-weight: 700;
      color: #111111;
      line-height: 1.2;
      margin: 0;
    }

    /* 무드보드 이미지 카드 */
    .card.image-card {
      min-height: 420px;
      display: flex;
    }

    .card.image-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
  </style>
</head>
<body>

  <!-- 상단 헤더 -->
  <header class="header">
    <div class="nav-buttons">
      <button>+ BOOKMARK</button>
      <button>+ MEMO</button>
      <button>+ YOUTUBE</button>
      <button>+ MOODBOARD</button>
      <button>+ RSS FEED</button>
    </div>
    <button class="theme-btn">THEME</button>
  </header>

  <!-- 메인 카드 그리드 -->
  <main class="dashboard-grid">
    <!-- 아이콘 카드 -->
    <div class="card text-card">
      <div class="card-content">⌘</div>
    </div>

    <!-- 텍스트 카드 -->
    <div class="card text-card">
      <div class="card-content">anon</div>
    </div>

    <!-- 무드보드 이미지 카드 (정상 출력되는 이미지) -->
    <div class="card image-card">
      <img src="https://images.unsplash.com/photo-1579783902614-a3fb3927b675?w=600&auto=format&fit=crop" alt="moodboard image">
    </div>
  </main>

</body>
</html>
