<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시작페이지</title>
    <style>
        :root {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --panel-bg: rgba(30, 30, 30, 0.75);
            --border-color: rgba(255, 255, 255, 0.1);
        }

        body.light-mode {
            --bg-color: #f4f4f4;
            --text-color: #222222;
            --panel-bg: rgba(255, 255, 255, 0.85);
            --border-color: rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .top-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .theme-toggle {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            backdrop-filter: blur(10px);
        }

        .search-container {
            display: flex;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px 18px;
            backdrop-filter: blur(10px);
            align-items: center;
            max-width: 800px;
            margin: 0 auto 20px auto;
        }

        .search-container input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-color);
            font-size: 16px;
            outline: none;
        }

        .search-container button {
            background: transparent;
            border: none;
            color: var(--text-color);
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        .action-buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            max-width: 1000px;
            margin: 0 auto 40px auto;
        }

        .action-buttons button {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            backdrop-filter: blur(10px);
            transition: background 0.2s;
        }

        .action-buttons button:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* 대시보드 그리드 레이아웃 */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            max-width: 1300px;
            margin: 0 auto;
        }

        .widget-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 18px;
            backdrop-filter: blur(10px);
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 200px;
        }

        .widget-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            opacity: 0.7;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .widget-title-input {
            background: transparent;
            border: none;
            color: var(--text-color);
            font-size: 13px;
            font-weight: bold;
            outline: none;
            width: 70%;
        }

        .widget-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .widget-add-sub, .widget-delete {
            background: none;
            border: none;
            color: var(--text-color);
            cursor: pointer;
            opacity: 0.6;
            font-size: 14px;
        }
        .widget-add-sub:hover, .widget-delete:hover {
            opacity: 1;
        }

        /* 북마크 그룹 스타일 */
        .bookmark-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 220px;
            overflow-y: auto;
        }
        .bookmark-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: var(--text-color);
            padding: 6px 8px;
            border-radius: 6px;
            transition: background 0.2s;
        }
        .bookmark-item:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        .bookmark-info {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
            text-decoration: none;
            color: var(--text-color);
        }
        .bookmark-info img {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            flex-shrink: 0;
        }
        .bookmark-name {
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 메모 스타일 (마우스 올릴 때만 툴바 표시) */
        .memo-toolbar {
            display: none;
            gap: 6px;
            flex-wrap: wrap;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 8px;
        }
        .widget-card:hover .memo-toolbar {
            display: flex;
        }
        .memo-toolbar button, .memo-toolbar input[type="color"] {
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 3px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .memo-toolbar input[type="color"] {
            padding: 0;
            width: 24px;
            height: 24px;
            vertical-align: middle;
        }
        .memo-editable {
            background: transparent;
            border: none;
            color: var(--text-color);
            width: 100%;
            height: 140px;
            outline: none;
            font-family: inherit;
            font-size: 14px;
            overflow-y: auto;
            padding: 4px 0;
        }

        /* 날씨 스타일 */
        .weather-content {
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
        }
        .weather-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .weather-temp-box {
            display: flex;
            align-items: baseline;
            gap: 4px;
        }
        .weather-temp {
            font-size: 32px;
            font-weight: bold;
        }
        .weather-unit {
            font-size: 18px;
            opacity: 0.8;
        }
        .weather-desc {
            font-size: 15px;
            font-weight: 600;
            text-align: right;
        }
        .weather-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            border-top: 1px solid var(--border-color);
            padding-top: 10px;
            font-size: 13px;
            opacity: 0.85;
        }

        /* 유튜브 스타일 (재생바 제거 및 클릭 방지) */
        .youtube-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
            pointer-events: none;
        }
        .youtube-container iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border: none;
        }

        /* 갤러리 - 벽에 붙인 포스터 스타일 */
        .gallery-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            padding: 5px;
            max-height: 250px;
            overflow-y: auto;
        }
        .gallery-item {
            position: relative;
            transition: transform 0.2s ease-out;
        }
        .gallery-item img {
            display: block;
            height: 130px;
            width: auto;
            border-radius: 2px;
            box-shadow: 2px 4px 10px rgba(0, 0, 0, 0.4);
            object-fit: cover;
        }
        .gallery-item:hover {
            transform: scale(1.05) rotate(-2deg);
            z-index: 10;
        }
        .gallery-item .widget-delete {
            position: absolute;
            top: 4px;
            right: 4px;
            background: rgba(0,0,0,0.8);
            padding: 2px 6px;
            border-radius: 4px;
            opacity: 0;
            transition: opacity 0.2s;
            color: #fff;
        }
        .gallery-item:hover .widget-delete {
            opacity: 1;
        }

        /* RSS 피드 스타일 */
        .rss-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 200px;
            overflow-y: auto;
        }
        .rss-item {
            text-decoration: none;
            color: var(--text-color);
            font-size: 13px;
            padding: 4px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .rss-item:hover {
            color: #fff;
            text-decoration: underline;
        }

        /* 모달 팝업 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal.active {
            display: flex;
        }
        .modal-box {
            background: #1e1e1e;
            border: 1px solid var(--border-color);
            padding: 24px;
            border-radius: 14px;
            width: 340px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            color: #fff;
        }
        .modal-box input {
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            outline: none;
            font-size: 14px;
        }
        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
        .modal-buttons button {
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            border: none;
            font-weight: 600;
        }
        .btn-cancel { background: #444; color: #fff; }
        .btn-submit { background: #fff; color: #000; }
    </style>
</head>
<body>

    <div class="top-bar">
        <button class="theme-toggle" onclick="toggleTheme()">바탕화면 색상</button>
    </div>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="구글 검색..." onkeypress="handleSearch(event)">
        <button onclick="performSearch()">검색</button>
    </div>

    <div class="action-buttons">
        <button onclick="addWidgetModal('bookmark')">+ 북마크 박스</button>
        <button onclick="addWidgetModal('memo')">+ 메모</button>
        <button onclick="addWeatherWidget()">+ 날씨</button>
        <button onclick="addWidgetModal('youtube')">+ 유튜브</button>
        <button onclick="addWidgetModal('gallery')">+ 이미지 갤러리</button>
        <button onclick="addWidgetModal('rss')">+ RSS 피드</button>
    </div>

    <div class="dashboard-grid" id="dashboardGrid"></div>

    <div class="modal" id="commonModal">
        <div class="modal-box">
            <h3 id="modalTitle">추가</h3>
            <input type="text" id="modalInput" placeholder="URL 또는 내용을 입력하세요">
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeModal()">취소</button>
                <button class="btn-submit" onclick="submitModal()">확인</button>
            </div>
        </div>
    </div>

    <script>
        let widgets = JSON.parse(localStorage.getItem('dashboard_widgets')) || [];
        let modalState = { type: '', targetIndex: null };

        function renderWidgets() {
            const grid = document.getElementById('dashboardGrid');
            grid.innerHTML = '';

            widgets.forEach((widget, index) => {
                const card = document.createElement('div');
                card.className = 'widget-card';

                let headerHTML = `
                    <div class="widget-header">
                        <input type="text" class="widget-title-input" value="${widget.title || widget.type.toUpperCase()}" onchange="updateWidgetTitle(${index}, this.value)">
                        <div class="widget-controls">
                `;

                if (widget.type === 'bookmark' || widget.type === 'gallery') {
                    headerHTML += `<button class="widget-add-sub" onclick="openSubModal(${index})">+</button>`;
                }

                headerHTML += `
                            <button class="widget-delete" onclick="deleteWidget(${index})">×</button>
                        </div>
                    </div>
                `;

                if (widget.type === 'bookmark') {
                    let itemsHTML = (widget.items || []).map((item, itemIdx) => `
                        <div class="bookmark-item">
                            <a href="${item.url}" target="_blank" class="bookmark-info" style="flex:1;">
                                <img src="https://www.google.com/s2/favicons?domain=${item.url}&sz=32" onerror="this.src='https://via.placeholder.com/20'">
                                <span class="bookmark-name">${item.title || item.url}</span>
                            </a>
                            <button class="widget-delete" style="font-size:12px;" onclick="deleteBookmarkItem(${index}, ${itemIdx})">×</button>
                        </div>
                    `).join('');
                    card.innerHTML = headerHTML + `<div class="bookmark-list">${itemsHTML}</div>`;
                } 
                else if (widget.type === 'memo') {
                    card.innerHTML = headerHTML + `
                        <div class="memo-toolbar">
                            <button onclick="formatMemo('bold')"><b>B</b></button>
                            <button onclick="formatMemo('underline')"><u>U</u></button>
                            <button onclick="formatMemo('fontSize', '5')">확대</button>
                            <button onclick="formatMemo('fontSize', '3')">기본</button>
                            <input type="color" onchange="formatMemo('foreColor', this.value)" title="글자 색상">
                        </div>
                        <div class="memo-editable" contenteditable="true" oninput="updateMemo(${index}, this.innerHTML)">${widget.content || ''}</div>
                    `;
                } 
                else if (widget.type === 'weather') {
                    card.innerHTML = headerHTML + `
                        <div class="weather-content">
                            <div class="weather-main">
                                <div class="weather-temp-box">
                                    <div class="weather-temp">${widget.temp !== undefined ? widget.temp : '--'}</div>
                                    <div class="weather-unit">°C</div>
                                </div>
                                <div class="weather-desc">${widget.condition || '위치 확인 중...'}</div>
                            </div>
                            <div class="weather-details">
                                <div>체감온도: <b>${widget.apparentTemp !== undefined ? widget.apparentTemp + '°C' : '--'}</b></div>
                                <div>강수확률: <b>${widget.precipProb !== undefined ? widget.precipProb + '%' : '--'}</b></div>
                            </div>
                        </div>
                    `;
                } 
                else if (widget.type === 'youtube') {
                    card.innerHTML = headerHTML + `
                        <div class="youtube-container">
                            <iframe src="https://www.youtube.com/embed/${widget.videoId}?autoplay=1&mute=1&loop=1&controls=0&playlist=${widget.videoId}" allow="autoplay; encrypted-media" allowfullscreen></iframe>
                        </div>
                    `;
                } 
                else if (widget.type === 'gallery') {
                    let imagesHTML = (widget.images || []).map((imgUrl, imgIdx) => `
                        <div class="gallery-item">
                            <img src="${imgUrl}" onerror="this.src='https://via.placeholder.com/150'">
                            <button class="widget-delete" onclick="deleteGalleryItem(${index}, ${imgIdx})">×</button>
                        </div>
                    `).join('');
                    card.innerHTML = headerHTML + `<div class="gallery-grid">${imagesHTML}</div>`;
                } 
                else if (widget.type === 'rss') {
                    let rssHTML = (widget.items || []).map(item => `
                        <a href="${item.link}" target="_blank" class="rss-item">${item.title}</a>
                    `).join('') || '<div style="font-size:13px; opacity:0.6;">RSS 로딩 중...</div>';
                    card.innerHTML = headerHTML + `<div class="rss-list">${rssHTML}</div>`;
                }

                grid.appendChild(card);
            });
            localStorage.setItem('dashboard_widgets', JSON.stringify(widgets));
        }

        function handleSearch(e) {
            if (e.key === 'Enter') performSearch();
        }
        function performSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (query) {
                window.location.href = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
            }
        }

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            localStorage.setItem('theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
        }
        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light-mode');
        }

        function updateWidgetTitle(index, title) {
            widgets[index].title = title;
            localStorage.setItem('dashboard_widgets', JSON.stringify(widgets));
        }

        function formatMemo(command, value = null) {
            document.execCommand(command, false, value);
        }

        function addWidgetModal(type) {
            modalState = { type: type, targetIndex: null };
            document.getElementById('commonModal').classList.add('active');
            const placeholders = {
                bookmark: '북마크 URL 입력 (예: https://naver.com)',
                youtube: '유튜브 링크 또는 비디오 ID 입력',
                gallery: '이미지 주소(URL) 입력',
                rss: 'RSS 피드 URL 입력',
                memo: ''
            };
            document.getElementById('modalInput').value = '';
            document.getElementById('modalInput').placeholder = placeholders[type] || '';
            document.getElementById('modalTitle').innerText = type.toUpperCase() + ' 추가';

            if (type === 'memo') {
                widgets.push({ type: 'memo', title: 'MEMO', content: '' });
                renderWidgets();
                closeModal();
            }
        }

        function openSubModal(index) {
            modalState = { type: 'sub_add', targetIndex: index };
            document.getElementById('commonModal').classList.add('active');
            const widgetType = widgets[index].type;
            document.getElementById('modalInput').value = '';
            document.getElementById('modalInput').placeholder = widgetType === 'bookmark' ? '추가할 URL 입력' : '추가할 이미지 URL 입력';
            document.getElementById('modalTitle').innerText = widgetType === 'bookmark' ? '북마크 항목 추가' : '갤러리 이미지 추가';
        }

        function closeModal() {
            document.getElementById('commonModal').classList.remove('active');
        }

        async function submitModal() {
            const val = document.getElementById('modalInput').value.trim();
            if (!val) return;

            if (modalState.targetIndex !== null) {
                const widget = widgets[modalState.targetIndex];
                if (widget.type === 'bookmark') {
                    let url = val;
                    if (!url.startsWith('http://') && !url.startsWith('https://')) url = 'https://' + url;
                    try {
                        const parsed = new URL(url);
                        widget.items.push({ url: url, title: parsed.hostname.replace('www.', '') });
                    } catch(e) { alert('올바른 URL이 아닙니다.'); return; }
                } else if (widget.type === 'gallery') {
                    widget.images.push(val);
                }
            } else {
                if (modalState.type === 'bookmark') {
                    let url = val;
                    if (!url.startsWith('http://') && !url.startsWith('https://')) url = 'https://' + url;
                    try {
                        const parsed = new URL(url);
                        widgets.push({
                            type: 'bookmark',
                            title: 'BOOKMARK',
                            items: [{ url: url, title: parsed.hostname.replace('www.', '') }]
                        });
                    } catch(e) { alert('올바른 URL이 아닙니다.'); return; }
                } else if (modalState.type === 'youtube') {
                    let videoId = val;
                    if (val.includes('youtu.be/')) {
                        videoId = val.split('youtu.be/')[1].split('?')[0];
                    } else if (val.includes('watch?v=')) {
                        videoId = val.split('watch?v=')[1].split('&')[0];
                    }
                    widgets.push({ type: 'youtube', title: 'YOUTUBE', videoId: videoId });
                } else if (modalState.type === 'gallery') {
                    widgets.push({ type: 'gallery', title: 'GALLERY', images: [val] });
                } else if (modalState.type === 'rss') {
                    widgets.push({ type: 'rss', title: 'RSS FEED', feedUrl: val, items: [] });
                    fetchRssFeed(widgets.length - 1, val);
                }
            }

            renderWidgets();
            closeModal();
        }

        async function fetchRssFeed(index, rssUrl) {
            try {
                const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`);
                const data = await res.json();
                if (data.status === 'ok') {
                    widgets[index].items = data.items.map(item => ({ title: item.title, link: item.link }));
                    renderWidgets();
                }
            } catch (err) {
                console.error('RSS 로드 실패');
            }
        }

        function updateMemo(index, htmlContent) {
            widgets[index].content = htmlContent;
            localStorage.setItem('dashboard_widgets', JSON.stringify(widgets));
        }

        function addWeatherWidget() {
            const index = widgets.length;
            widgets.push({ type: 'weather', title: 'WEATHER', locationName: '위치 요청 중', condition: 'GPS 허용 필요' });
            renderWidgets();

            if (!navigator.geolocation) return;

            navigator.geolocation.getCurrentPosition(async (pos) => {
                const lat = pos.coords.latitude;
                const lon = pos.coords.longitude;
                try {
                    const geoRes = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=14&accept-language=ko`);
                    const geoData = await geoRes.json();
                    const address = geoData.address;
                    const district = address.borough || address.suburb || address.city || '';
                    const neighborhood = address.neighbourhood || address.quarter || address.village || '';
                    const locName = (district + ' ' + neighborhood).trim() || '내 위치';

                    const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,weather_code&daily=precipitation_probability_max&timezone=auto`);
                    const weatherData = await weatherRes.json();

                    const cur = weatherData.current;
                    const code = cur.weather_code;
                    let cond = '맑음';
                    if (code >= 1 && code <= 3) cond = '구름 많음';
                    else if (code >= 45 && code <= 48) cond = '안개';
                    else if (code >= 51 && code <= 67) cond = '비 오는 중';
                    else if (code >= 71) cond = '눈';

                    widgets[index].title = locName;
                    widgets[index].temp = Math.round(cur.temperature_2m);
                    widgets[index].apparentTemp = Math.round(cur.apparent_temperature);
                    widgets[index].condition = cond;
                    widgets[index].precipProb = weatherData.daily.precipitation_probability_max ? weatherData.daily.precipitation_probability_max[0] : 0;
                    renderWidgets();
                } catch(e) {
                    widgets[index].condition = '로드 실패';
                    renderWidgets();
                }
            });
        }

        function deleteWidget(index) {
            widgets.splice(index, 1);
            renderWidgets();
        }

        function deleteBookmarkItem(widgetIdx, itemIdx) {
            widgets[widgetIdx].items.splice(itemIdx, 1);
            renderWidgets();
        }

        function deleteGalleryItem(widgetIdx, imgIdx) {
            widgets[widgetIdx].images.splice(imgIdx, 1);
            renderWidgets();
        }

        widgets.forEach((w, idx) => {
            if (w.type === 'rss' && w.feedUrl) {
                fetchRssFeed(idx, w.feedUrl);
            }
        });

        renderWidgets();
    </script>
</body>
</html>
