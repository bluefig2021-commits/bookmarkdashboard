<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start Page</title>
    <style>
        :root {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --panel-bg: rgba(30, 30, 30, 0.75);
            --border-color: rgba(255, 255, 255, 0.1);
        }

        body.light-mode {
            --bg-color: #f4f4f4;
            --text-color: #222222;
            --panel-bg: rgba(255, 255, 255, 0.85);
            --border-color: rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .top-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .theme-toggle {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            backdrop-filter: blur(10px);
        }

        .search-container {
            display: flex;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px 18px;
            backdrop-filter: blur(10px);
            align-items: center;
            max-width: 800px;
            margin: 0 auto 20px auto;
        }

        .search-container input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-color);
            font-size: 16px;
            outline: none;
        }

        .search-container button {
            background: transparent;
            border: none;
            color: var(--text-color);
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        .action-buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            max-width: 1000px;
            margin: 0 auto 40px auto;
        }

        .action-buttons button {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            backdrop-filter: blur(10px);
            transition: background 0.2s;
        }

        .action-buttons button:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* Dashboard masonry layout - cards pack tightly like a moodboard */
        .dashboard-grid {
            column-count: 3;
            column-gap: 24px;
            max-width: 1300px;
            margin: 0 auto;
        }
        @media (max-width: 1000px) { .dashboard-grid { column-count: 2; } }
        @media (max-width: 600px) { .dashboard-grid { column-count: 1; } }

        .widget-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 18px;
            backdrop-filter: blur(10px);
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 12px;
            break-inside: avoid;
            width: 100%;
            margin-bottom: 24px;
            transition: all 0.3s ease;
        }

        /* Gallery moodboard mode: no card shell, border, or padding */
        .widget-card.gallery-mode {
            background: transparent !important;
            border: none !important;
            backdrop-filter: none !important;
            box-shadow: none !important;
            padding: 0 !important;
            min-height: auto;
        }

        .widget-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            opacity: 0.7;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        /* Gallery mode header overlay (only appears on hover) */
        .widget-card.gallery-mode .widget-header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0) 100%);
            padding: 12px 16px 24px 16px;
            border-bottom: none;
            border-radius: 14px 14px 0 0;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 100;
        }
        
        .widget-card.gallery-mode:hover .widget-header {
            opacity: 1;
        }

        .widget-card.gallery-mode .widget-title-input {
            color: #fff;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        .widget-card.gallery-mode .widget-add-sub,
        .widget-card.gallery-mode .widget-delete {
            color: #fff;
            opacity: 0.8;
        }
        .widget-card.gallery-mode .widget-add-sub:hover,
        .widget-card.gallery-mode .widget-delete:hover {
            opacity: 1;
        }

        .widget-title-input {
            background: transparent;
            border: none;
            color: var(--text-color);
            font-size: 13px;
            font-weight: bold;
            outline: none;
            width: 70%;
        }

        .widget-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .widget-add-sub, .widget-delete {
            background: none;
            border: none;
            color: var(--text-color);
            cursor: pointer;
            opacity: 0.6;
            font-size: 14px;
        }
        .widget-add-sub:hover, .widget-delete:hover {
            opacity: 1;
        }

        /* Bookmark list */
        .bookmark-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 250px;
            overflow-y: auto;
        }
        .bookmark-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 8px;
            border-radius: 6px;
            transition: background 0.2s;
        }
        .bookmark-item:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        .bookmark-info {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
            text-decoration: none;
            color: var(--text-color);
        }
        .bookmark-info img {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            flex-shrink: 0;
        }
        .bookmark-name {
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .bookmark-actions {
            display: flex;
            gap: 4px;
        }
        .action-icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 12px;
            opacity: 0.5;
            transition: opacity 0.2s;
        }
        .action-icon-btn:hover {
            opacity: 1;
        }

        /* Memo styles */
        .memo-toolbar {
            display: none;
            gap: 6px;
            flex-wrap: wrap;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 8px;
        }
        .widget-card:hover .memo-toolbar {
            display: flex;
        }
        .memo-toolbar button, .memo-toolbar input[type="color"] {
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 3px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .memo-toolbar input[type="color"] {
            padding: 0;
            width: 24px;
            height: 24px;
            vertical-align: middle;
        }
        .memo-editable {
            background: transparent;
            border: none;
            color: var(--text-color);
            width: 100%;
            height: 140px;
            outline: none;
            font-family: inherit;
            font-size: 14px;
            overflow-y: auto;
            padding: 4px 0;
        }

        /* YouTube style */
        .youtube-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
            pointer-events: none;
        }
        .youtube-container iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border: none;
        }

        /* Gallery - no card shell, fill 100% */
        .gallery-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
        }
        .gallery-item {
            position: relative;
            width: 100%;
        }
        .gallery-item img {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            object-fit: cover;
        }
        .gallery-item .widget-delete-img {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            border: none;
            color: #fff;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
        }
        .gallery-item:hover .widget-delete-img {
            opacity: 1;
        }

        /* RSS feed */
        .rss-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 200px;
            overflow-y: auto;
        }
        .rss-item {
            text-decoration: none;
            color: var(--text-color);
            font-size: 13px;
            padding: 4px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .rss-item:hover {
            color: #fff;
            text-decoration: underline;
        }

        /* Modal popup */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal.active {
            display: flex;
        }
        .modal-box {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 24px;
            border-radius: 14px;
            width: 340px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            color: var(--text-color);
            backdrop-filter: blur(10px);
        }
        .modal-box input {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px;
            border-radius: 6px;
            outline: none;
            font-size: 14px;
        }
        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
        .modal-buttons button {
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            border: none;
            font-weight: 600;
        }
        .btn-cancel { background: var(--border-color); color: var(--text-color); }
        .btn-submit { background: var(--text-color); color: var(--bg-color); }
    </style>
</head>
<body>

    <div class="top-bar">
        <button class="theme-toggle" onclick="toggleTheme()">Theme</button>
    </div>

    <div class="action-buttons">
        <button onclick="addWidgetModal('bookmark')">+ Bookmark Box</button>
        <button onclick="addWidgetModal('memo')">+ Memo</button>
        <button onclick="addWidgetModal('youtube')">+ YouTube</button>
        <button onclick="addWidgetModal('gallery')">+ Moodboard (Image)</button>
        <button onclick="addWidgetModal('rss')">+ RSS Feed</button>
    </div>

    <div class="dashboard-grid" id="dashboardGrid"></div>

    <div class="modal" id="commonModal">
        <div class="modal-box">
            <h3 id="modalTitle">Add</h3>
            <input type="text" id="modalInput" placeholder="Enter a URL or content">
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeModal()">Cancel</button>
                <button class="btn-submit" onclick="submitModal()">Confirm</button>
            </div>
        </div>
    </div>

    <script>
        // Filter out and remove any leftover weather widget from localStorage on render
        let rawWidgets = JSON.parse(localStorage.getItem('dashboard_widgets')) || [];
        let widgets = rawWidgets.filter(w => w.type !== 'weather');
        localStorage.setItem('dashboard_widgets', JSON.stringify(widgets));

        let modalState = { type: '', targetIndex: null };

        function renderWidgets() {
            const grid = document.getElementById('dashboardGrid');
            grid.innerHTML = '';

            widgets.forEach((widget, index) => {
                const card = document.createElement('div');
                const isGallery = widget.type === 'gallery';
                
                card.className = isGallery ? 'widget-card gallery-mode' : 'widget-card';

                let headerHTML = `
                    <div class="widget-header">
                        <input type="text" class="widget-title-input" value="${widget.title || widget.type.toUpperCase()}" onchange="updateWidgetTitle(${index}, this.value)">
                        <div class="widget-controls">
                `;

                if (widget.type === 'bookmark' || widget.type === 'gallery') {
                    headerHTML += `<button class="widget-add-sub" onclick="openSubModal(${index})">+</button>`;
                }

                headerHTML += `
                            <button class="widget-delete" onclick="deleteWidget(${index})">×</button>
                        </div>
                    </div>
                `;

                if (widget.type === 'bookmark') {
                    let itemsHTML = (widget.items || []).map((item, itemIdx) => `
                        <div class="bookmark-item">
                            <a href="${item.url}" target="_blank" class="bookmark-info" style="flex:1;" title="${item.url}">
                                <img src="https://www.google.com/s2/favicons?domain=${item.url}&sz=32" onerror="this.src='https://via.placeholder.com/20'">
                                <span class="bookmark-name">${item.title || item.url}</span>
                            </a>
                            <div class="bookmark-actions">
                                <button class="action-icon-btn" onclick="editBookmarkTitle(${index}, ${itemIdx})" title="Edit name">✏️</button>
                                <button class="action-icon-btn" onclick="deleteBookmarkItem(${index}, ${itemIdx})" title="Delete">❌</button>
                            </div>
                        </div>
                    `).join('');
                    card.innerHTML = headerHTML + `<div class="bookmark-list">${itemsHTML}</div>`;
                } 
                else if (widget.type === 'memo') {
                    card.innerHTML = headerHTML + `
                        <div class="memo-toolbar">
                            <button onclick="formatMemo('bold')"><b>B</b></button>
                            <button onclick="formatMemo('underline')"><u>U</u></button>
                            <button onclick="formatMemo('fontSize', '5')">Bigger</button>
                            <button onclick="formatMemo('fontSize', '3')">Default</button>
                            <input type="color" onchange="formatMemo('foreColor', this.value)" title="Text color">
                        </div>
                        <div class="memo-editable" contenteditable="true" oninput="updateMemo(${index}, this.innerHTML)">${widget.content || ''}</div>
                    `;
                } 
                else if (widget.type === 'youtube') {
                    card.innerHTML = headerHTML + `
                        <div class="youtube-container">
                            <iframe src="https://www.youtube.com/embed/${widget.videoId}?autoplay=1&mute=1&loop=1&controls=0&playlist=${widget.videoId}" allow="autoplay; encrypted-media" allowfullscreen></iframe>
                        </div>
                    `;
                } 
                else if (widget.type === 'gallery') {
                    let imagesHTML = (widget.images || []).map((imgUrl, imgIdx) => `
                        <div class="gallery-item">
                            <img src="${imgUrl}" onerror="this.src='https://via.placeholder.com/150'">
                            <button class="widget-delete-img" onclick="deleteGalleryItem(${index}, ${imgIdx})" title="Delete photo">×</button>
                        </div>
                    `).join('');
                    card.innerHTML = headerHTML + `<div class="gallery-grid">${imagesHTML}</div>`;
                } 
                else if (widget.type === 'rss') {
                    let rssHTML = (widget.items || []).map(item => `
                        <a href="${item.link}" target="_blank" class="rss-item">${item.title}</a>
                    `).join('') || '<div style="font-size:13px; opacity:0.6;">Loading RSS...</div>';
                    card.innerHTML = headerHTML + `<div class="rss-list">${rssHTML}</div>`;
                }

                grid.appendChild(card);
            });
            localStorage.setItem('dashboard_widgets', JSON.stringify(widgets));
        }

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            localStorage.setItem('theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
        }
        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light-mode');
        }

        function updateWidgetTitle(index, title) {
            widgets[index].title = title;
            localStorage.setItem('dashboard_widgets', JSON.stringify(widgets));
        }

        function formatMemo(command, value = null) {
            document.execCommand(command, false, value);
        }

        function addWidgetModal(type) {
            if (type === 'memo') {
                widgets.push({ type: 'memo', title: 'MEMO', content: '' });
                renderWidgets();
                return;
            }
            modalState = { type: type, targetIndex: null };
            document.getElementById('commonModal').classList.add('active');
            const placeholders = {
                bookmark: 'Enter bookmark URL (e.g. https://naver.com)',
                youtube: 'Enter YouTube link or video ID',
                gallery: 'Enter image URL',
                rss: 'Enter RSS feed URL'
            };
            document.getElementById('modalInput').value = '';
            document.getElementById('modalInput').placeholder = placeholders[type] || '';
            document.getElementById('modalTitle').innerText = 'Add ' + type.toUpperCase();
        }

        function openSubModal(index) {
            modalState = { type: 'sub_add', targetIndex: index };
            document.getElementById('commonModal').classList.add('active');
            const widgetType = widgets[index].type;
            document.getElementById('modalInput').value = '';
            document.getElementById('modalInput').placeholder = widgetType === 'bookmark' ? 'Enter URL to add' : 'Enter image URL to add';
            document.getElementById('modalTitle').innerText = widgetType === 'bookmark' ? 'Add bookmark item' : 'Add moodboard image';
        }

        function closeModal() {
            document.getElementById('commonModal').classList.remove('active');
        }

        async function submitModal() {
            const val = document.getElementById('modalInput').value.trim();
            if (!val) return;

            if (modalState.targetIndex !== null) {
                const widget = widgets[modalState.targetIndex];
                if (widget.type === 'bookmark') {
                    let url = val;
                    if (!url.startsWith('http://') && !url.startsWith('https://')) url = 'https://' + url;
                    try {
                        const parsed = new URL(url);
                        let fallbackTitle = parsed.hostname.replace('www.', '');
                        widget.items.push({ url: url, title: fallbackTitle });
                        renderWidgets();
                    } catch(e) { alert('Not a valid URL.'); return; }
                } else if (widget.type === 'gallery') {
                    widget.images.push(val);
                    renderWidgets();
                }
            } else {
                if (modalState.type === 'bookmark') {
                    let url = val;
                    if (!url.startsWith('http://') && !url.startsWith('https://')) url = 'https://' + url;
                    try {
                        const parsed = new URL(url);
                        let fallbackTitle = parsed.hostname.replace('www.', '');
                        widgets.push({
                            type: 'bookmark',
                            title: 'BOOKMARK',
                            items: [{ url: url, title: fallbackTitle }]
                        });
                        renderWidgets();
                    } catch(e) { alert('Not a valid URL.'); return; }
                } else if (modalState.type === 'youtube') {
                    let videoId = val;
                    if (val.includes('youtu.be/')) {
                        videoId = val.split('youtu.be/')[1].split('?')[0];
                    } else if (val.includes('watch?v=')) {
                        videoId = val.split('watch?v=')[1].split('&')[0];
                    }
                    widgets.push({ type: 'youtube', title: 'YOUTUBE', videoId: videoId });
                    renderWidgets();
                } else if (modalState.type === 'gallery') {
                    widgets.push({ type: 'gallery', title: 'MOODBOARD', images: [val] });
                    renderWidgets();
                } else if (modalState.type === 'rss') {
                    widgets.push({ type: 'rss', title: 'RSS FEED', feedUrl: val, items: [] });
                    fetchRssFeed(widgets.length - 1, val);
                }
            }

            closeModal();
        }

        function editBookmarkTitle(wIdx, iIdx) {
            const currentTitle = widgets[wIdx].items[iIdx].title;
            const newTitle = prompt('Enter a new bookmark title:', currentTitle);
            if (newTitle !== null && newTitle.trim() !== '') {
                widgets[wIdx].items[iIdx].title = newTitle.trim();
                localStorage.setItem('dashboard_widgets', JSON.stringify(widgets));
                renderWidgets();
            }
        }

        async function fetchRssFeed(index, rssUrl) {
            try {
                const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`);
                const data = await res.json();
                if (data.status === 'ok') {
                    widgets[index].items = data.items.map(item => ({ title: item.title, link: item.link }));
                    renderWidgets();
                }
            } catch (err) {
                console.error('Failed to load RSS feed');
            }
        }

        function updateMemo(index, htmlContent) {
            widgets[index].content = htmlContent;
            localStorage.setItem('dashboard_widgets', JSON.stringify(widgets));
        }

        function deleteWidget(index) {
            widgets.splice(index, 1);
            renderWidgets();
        }

        function deleteBookmarkItem(widgetIdx, itemIdx) {
            widgets[widgetIdx].items.splice(itemIdx, 1);
            renderWidgets();
        }

        function deleteGalleryItem(widgetIdx, imgIdx) {
            widgets[widgetIdx].images.splice(imgIdx, 1);
            renderWidgets();
        }

        widgets.forEach((w, idx) => {
            if (w.type === 'rss' && w.feedUrl) {
                fetchRssFeed(idx, w.feedUrl);
            }
        });

        renderWidgets();
    </script>
</body>
</html>
