<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start Page</title>
    <style>
        :root {
            --bg-color: #f3f5f9;
            --text-color: #232a38;
            --panel-bg: rgba(255, 255, 255, 0.92);
            --border-color: rgba(30, 50, 90, 0.12);
            --hover: rgba(30, 50, 90, 0.07);
            --btn-bg: rgba(30, 50, 90, 0.06);
            --chip-bg: rgba(30, 50, 90, 0.05);
            --danger: #c23a4f;
        }

        body.dark-mode {
            --bg-color: #1f2533;
            --text-color: #e6ebf5;
            --panel-bg: rgba(41, 49, 66, 0.9);
            --border-color: rgba(255, 255, 255, 0.12);
            --hover: rgba(255, 255, 255, 0.09);
            --btn-bg: rgba(255, 255, 255, 0.1);
            --chip-bg: rgba(255, 255, 255, 0.07);
            --danger: #ff8095;
        }

        * { box-sizing: border-box; }
        [hidden] { display: none !important; }

        body {
            margin: 0;
            padding: 40px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* ===== 잠금 화면 ===== */
        #gate {
            position: fixed; inset: 0; z-index: 3000;
            display: grid; place-items: center; padding: 24px;
            background: var(--bg-color);
        }
        .gate-box {
            background: var(--panel-bg); border: 1px solid var(--border-color);
            border-radius: 14px; padding: 28px; width: 100%; max-width: 380px;
        }
        .gate-box h1 { margin: 0 0 6px; font-size: 20px; }
        .gate-box p { margin: 0 0 14px; font-size: 14px; opacity: 0.7; }
        #gateMsg { color: var(--danger); font-size: 14px; min-height: 1.3em; margin-bottom: 12px; }
        .gate-box button {
            background: var(--text-color); color: var(--bg-color); border: none;
            padding: 9px 16px; border-radius: 8px; font-weight: 600; cursor: pointer;
        }
        .gate-box button:disabled { opacity: 0.4; cursor: not-allowed; }

        .top-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        #who { font-size: 13px; opacity: 0.7; }

        .theme-toggle {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            backdrop-filter: blur(10px);
        }

        .search-container {
            display: flex;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px 18px;
            backdrop-filter: blur(10px);
            align-items: center;
            max-width: 800px;
            margin: 0 auto 20px auto;
        }

        .search-container input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-color);
            font-size: 16px;
            outline: none;
        }

        .search-container button {
            background: transparent;
            border: none;
            color: var(--text-color);
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        .action-buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            max-width: 1000px;
            margin: 0 auto 40px auto;
        }

        .action-buttons button, .action-buttons label {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            backdrop-filter: blur(10px);
            transition: background 0.2s;
        }

        .action-buttons button:hover, .action-buttons label:hover {
            background: var(--hover);
        }

        /* Dashboard masonry layout - cards pack tightly like a moodboard */
        .dashboard-grid {
            column-count: 3;
            column-gap: 24px;
            max-width: 1300px;
            margin: 0 auto;
        }
        @media (max-width: 1000px) { .dashboard-grid { column-count: 2; } }
        @media (max-width: 600px) { .dashboard-grid { column-count: 1; } body { padding: 20px; } }

        .widget-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 18px;
            backdrop-filter: blur(10px);
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 12px;
            break-inside: avoid;
            width: 100%;
            margin-bottom: 24px;
            transition: all 0.3s ease;
        }

        /* Gallery moodboard mode: no card shell, border, or padding */
        .widget-card.gallery-mode {
            background: transparent !important;
            border: none !important;
            backdrop-filter: none !important;
            box-shadow: none !important;
            padding: 0 !important;
            min-height: auto;
        }

        .widget-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            opacity: 0.7;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        /* Gallery mode header overlay (only appears on hover) */
        .widget-card.gallery-mode .widget-header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0) 100%);
            padding: 12px 16px 24px 16px;
            border-bottom: none;
            border-radius: 14px 14px 0 0;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 100;
        }

        .widget-card.gallery-mode:hover .widget-header { opacity: 1; }

        .widget-card.gallery-mode .widget-title-input {
            color: #fff;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        .widget-card.gallery-mode .widget-add-sub,
        .widget-card.gallery-mode .widget-delete {
            color: #fff;
            opacity: 0.8;
        }
        .widget-card.gallery-mode .widget-add-sub:hover,
        .widget-card.gallery-mode .widget-delete:hover { opacity: 1; }

        .widget-title-input {
            background: transparent;
            border: none;
            color: var(--text-color);
            font-size: 13px;
            font-weight: bold;
            outline: none;
            width: 70%;
        }

        .widget-controls { display: flex; align-items: center; gap: 8px; }

        .widget-add-sub, .widget-delete {
            background: none;
            border: none;
            color: var(--text-color);
            cursor: pointer;
            opacity: 0.6;
            font-size: 14px;
        }
        .widget-add-sub:hover, .widget-delete:hover { opacity: 1; }

        /* Bookmark list */
        .bookmark-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 250px;
            overflow-y: auto;
        }
        .bookmark-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 8px;
            border-radius: 6px;
            transition: background 0.2s;
        }
        .bookmark-item:hover { background: var(--hover); }
        .bookmark-info {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
            text-decoration: none;
            color: var(--text-color);
        }
        .bookmark-info img { width: 20px; height: 20px; border-radius: 4px; flex-shrink: 0; }
        .bookmark-name {
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .bookmark-actions { display: flex; gap: 4px; }
        .action-icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 12px;
            opacity: 0.5;
            transition: opacity 0.2s;
        }
        .action-icon-btn:hover { opacity: 1; }

        /* Memo styles */
        .memo-toolbar {
            display: none;
            gap: 6px;
            flex-wrap: wrap;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 8px;
        }
        .widget-card:hover .memo-toolbar { display: flex; }
        .memo-toolbar button, .memo-toolbar input[type="color"] {
            background: var(--btn-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 3px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .memo-toolbar input[type="color"] { padding: 0; width: 24px; height: 24px; vertical-align: middle; }
        .memo-editable {
            background: transparent;
            border: none;
            color: var(--text-color);
            width: 100%;
            height: 140px;
            outline: none;
            font-family: inherit;
            font-size: 14px;
            overflow-y: auto;
            padding: 4px 0;
        }

        /* YouTube style */
        .youtube-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
            pointer-events: none;
        }
        .youtube-container iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border: none;
        }

        /* Gallery - no card shell, fill 100% */
        .gallery-grid { display: flex; flex-direction: column; gap: 16px; width: 100%; }
        .gallery-item { position: relative; width: 100%; }
        .gallery-item img {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            object-fit: cover;
        }
        .gallery-item .widget-delete-img {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            border: none;
            color: #fff;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
        }
        .gallery-item:hover .widget-delete-img { opacity: 1; }

        /* RSS feed */
        .rss-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 200px;
            overflow-y: auto;
        }
        .rss-item {
            text-decoration: none;
            color: var(--text-color);
            font-size: 13px;
            padding: 4px 0;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .rss-item:hover { text-decoration: underline; }

        /* ===== 요약노트(VAULT) 위젯 ===== */
        .vault-bar { display: flex; align-items: center; gap: 8px; font-size: 12px; opacity: 0.8; }
        .vault-bar button {
            background: var(--btn-bg); border: 1px solid var(--border-color);
            color: var(--text-color); border-radius: 4px; padding: 2px 8px; cursor: pointer; font-size: 12px;
        }
        .vault-bar .vcount { margin-left: auto; }
        .vault-list { display: flex; flex-direction: column; gap: 10px; max-height: 460px; overflow-y: auto; }
        .note {
            border: 1px solid var(--border-color); border-left: 3px solid #e58a9a;
            border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px;
        }
        .note.done { opacity: 0.5; }
        .note.done .note-title { text-decoration: line-through; }
        .note-top { display: flex; gap: 8px; align-items: flex-start; }
        .note-top input[type=checkbox] { margin-top: 3px; flex: none; }
        .note-main { flex: 1; min-width: 0; }
        .note-title { font-weight: 700; font-size: 14px; word-break: break-word; }
        .note-cat { font-size: 11px; opacity: 0.6; }
        .note-del { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 14px; opacity: 0.7; }
        .note-del:hover { opacity: 1; }
        .nsec { font-size: 12px; }
        .nsec .lab { display: inline-block; font-weight: 700; padding: 0 6px; border-radius: 2px; margin-bottom: 2px; }
        .nsec.s1 .lab { background: rgba(255, 225, 80, 0.28); }
        .nsec.s2 .lab { background: rgba(110, 220, 160, 0.28); }
        .nsec.s3 .lab { background: rgba(255, 130, 160, 0.28); }
        .nsec .txt { display: block; word-break: break-word; }
        .nsec .none { opacity: 0.5; }
        .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
        .chip { border: 1px solid var(--border-color); border-radius: 3px; padding: 0 6px; font-size: 11px; background: var(--chip-bg); }
        .chk { margin: 3px 0 0; padding-left: 16px; }
        .note-links { display: flex; flex-wrap: wrap; gap: 8px; }
        .note-links a { font-size: 11px; color: inherit; opacity: 0.75; word-break: break-all; }
        .vault-empty { font-size: 13px; opacity: 0.6; }

        /* Modal popup */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal.active { display: flex; }
        .modal-box {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 24px;
            border-radius: 14px;
            width: 340px;
            max-width: 92vw;
            display: flex;
            flex-direction: column;
            gap: 15px;
            color: var(--text-color);
            backdrop-filter: blur(10px);
        }
        .modal-box.wide { width: 560px; }
        .modal-box h3 { margin: 0; }
        .modal-box input, .modal-box textarea {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px;
            border-radius: 6px;
            outline: none;
            font-size: 14px;
            font-family: inherit;
        }
        .modal-box textarea { min-height: 170px; resize: vertical; }
        .modal-buttons { display: flex; justify-content: flex-end; gap: 10px; }
        .modal-buttons button { padding: 6px 12px; border-radius: 6px; cursor: pointer; border: none; font-weight: 600; }
        .btn-cancel { background: var(--border-color); color: var(--text-color); }
        .btn-submit { background: var(--text-color); color: var(--bg-color); }
        #vaultStatus { font-size: 13px; opacity: 0.8; min-height: 1.3em; }

        #toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: var(--panel-bg); border: 1px solid var(--border-color);
            padding: 8px 16px; border-radius: 8px; font-size: 13px; z-index: 2000;
            backdrop-filter: blur(10px); display: none;
        }
    </style>
</head>
<body>

    <!-- ===== 잠금 화면: 관리자 통과 전까지 항상 표시 ===== -->
    <section id="gate">
        <div class="gate-box">
            <h1>Start Page</h1>
            <p>관리자 계정으로 로그인해야 열립니다.</p>
            <div id="gateMsg"></div>
            <button id="btnLogin">Google로 로그인</button>
        </div>
    </section>

    <!-- ===== 대시보드: 관리자 통과 후에만 표시 ===== -->
    <div id="app" hidden>
        <div class="top-bar">
            <span id="who"></span>
            <button class="theme-toggle" id="btnLogout">로그아웃</button>
            <button class="theme-toggle" onclick="toggleTheme()">Theme</button>
        </div>

        <div class="action-buttons">
            <button onclick="addWidgetModal('bookmark')">+ Bookmark Box</button>
            <button onclick="addWidgetModal('memo')">+ Memo</button>
            <button onclick="addWidgetModal('youtube')">+ YouTube</button>
            <button onclick="addWidgetModal('gallery')">+ Moodboard (Image)</button>
            <button onclick="addWidgetModal('rss')">+ RSS Feed</button>
            <button onclick="addWidgetModal('vault')">+ 요약노트</button>
            <button onclick="openVaultModal(null)">붙여넣기 → 노트</button>
            <button onclick="exportBackup()">백업 내보내기</button>
            <label for="fileImport">백업/파일 가져오기</label>
            <input id="fileImport" type="file" accept=".json,application/json,.html,.htm,.txt,.xml" hidden>
        </div>

        <div class="dashboard-grid" id="dashboardGrid"></div>
    </div>

    <div class="modal" id="commonModal">
        <div class="modal-box">
            <h3 id="modalTitle">Add</h3>
            <input type="text" id="modalInput" placeholder="Enter a URL or content">
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeModal()">Cancel</button>
                <button class="btn-submit" onclick="submitModal()">Confirm</button>
            </div>
        </div>
    </div>

    <div class="modal" id="vaultModal">
        <div class="modal-box wide">
            <h3 id="vaultModalTitle">요약노트로 변환</h3>
            <textarea id="vaultPaste" placeholder="한 줄에 하나씩 붙여넣으세요. 북마크 HTML 내보내기 내용도 가능합니다.&#10;예) [앱테크] 출석 체크 500p 매일 https://example.com/attend&#10;예) [멤버십] 쿠팡 와우 해지 매월 15일 자동결제 4,990원 https://example.com"></textarea>
            <input type="url" id="vaultUrl" placeholder="items.json / light.json / RSS 주소 (선택)">
            <div id="vaultStatus" role="status"></div>
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeVaultModal()">닫기</button>
                <button class="btn-cancel" onclick="vaultFetchUrl()">주소에서 불러오기</button>
                <button class="btn-submit" onclick="vaultSubmit()">노트로 변환</button>
            </div>
        </div>
    </div>

    <div id="toast" role="status"></div>

    <!-- =================================================================
         대시보드 로직 (일반 스크립트: 인라인 onclick 핸들러용 전역 함수)
         ================================================================= -->
    <script>
        const LS_KEY = 'dashboard_widgets';       // 기존 Start Page 데이터 키 그대로 사용
        const LS_TS = 'dashboard_updated_at';
        const WIDGET_TYPES = ['bookmark', 'memo', 'youtube', 'gallery', 'rss', 'vault'];

        let widgets = [];
        let cloud = null;                          // 관리자 로그인 후 Firestore 어댑터 (USE_FIRESTORE=true 일 때만)
        let modalState = { type: '', targetIndex: null };
        let vaultTarget = null;

        /* ---------- 유틸 ---------- */
        const $ = (id) => document.getElementById(id);
        const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const safeUrl = (u) => (/^https?:\/\//i.test(String(u)) ? String(u) : '');
        const safeImg = (u) => (/^(https?:\/\/|data:image\/(png|jpe?g|gif|webp|svg\+xml);)/i.test(String(u)) ? String(u) : '');
        const uniq = (a) => [...new Set(a)];
        const newId = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2));
        const HIDE_IMG = "this.style.visibility='hidden'";

        let toastTimer;
        function toast(msg) {
            const t = $('toast');
            t.textContent = msg; t.style.display = 'block';
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { t.style.display = 'none'; }, 4000);
        }

        function sanitizeHtml(h) {
            const d = new DOMParser().parseFromString('<body>' + h, 'text/html');
            d.querySelectorAll('script,iframe,object,embed,link,meta,style,form,base').forEach((n) => n.remove());
            d.body.querySelectorAll('*').forEach((el) => {
                [...el.attributes].forEach((a) => {
                    const n = a.name.toLowerCase();
                    if (n.startsWith('on') || (['href', 'src', 'xlink:href', 'formaction'].includes(n) && /^\s*(javascript|data):/i.test(a.value))) {
                        el.removeAttribute(a.name);
                    }
                });
            });
            return d.body.innerHTML;
        }

        /* ---------- 저장 ---------- */
        function persistLocal() { localStorage.setItem(LS_KEY, JSON.stringify(widgets)); }

        let cloudTimer;
        function save() {
            persistLocal();
            localStorage.setItem(LS_TS, String(Date.now()));
            if (!cloud) return;
            clearTimeout(cloudTimer);
            cloudTimer = setTimeout(() => {
                cloud.save(JSON.stringify(widgets), Number(localStorage.getItem(LS_TS)))
                    .catch((e) => toast('Firestore 저장 실패: ' + e.message));
            }, 800);
        }

        function loadLocal() {
            try { widgets = (JSON.parse(localStorage.getItem(LS_KEY)) || []).filter((w) => w && w.type !== 'weather'); }
            catch { widgets = []; }
        }

        /* ---------- 요약노트 규칙 엔진 (외부 AI/유료 API 없음) ---------- */
        const URL_RE = /https?:\/\/[^\s<>"')\]]+/gi;
        const TAG_RE = /\[([^\]]{1,20})\]/g;
        const BENEFIT_RE = /(\d[\d,]*(?:\.\d+)?)\s*(만원|천원|원|포인트|캐시|코인|쿠폰|%|배|개월|pt|p(?![a-z]))/gi;
        const BENEFIT_WORDS = /무료체험|무료|공짜|적립|할인|캐시백|리워드|증정|사은품|무배|무료배송/g;
        const DATE_RES = [
            /\d{4}\s?[.\-\/]\s?\d{1,2}\s?[.\-\/]\s?\d{1,2}/g,
            /\d{1,2}월\s?\d{1,2}일/g,
            /\d{1,2}\/\d{1,2}(?=\s*(?:까지|마감|종료|해지|결제))/g,
            /D-\d+/gi,
            /매월\s?\d{1,2}일/g,
            /\d{1,2}일\s?(?:까지|마다|결제|갱신)/g,
            /(?:오늘|내일|이번\s?주|이번\s?달|월말|연말)(?:\s?까지)?/g
        ];
        const FLAG_KEYS = ['해지', '자동결제', '결제', '구독', '갱신', '취소', '환불', '만료', '마감', '무료체험', '위약', '약정', '종료', '까지'];
        const CHECKS = [
            [/해지/, '해지 경로·기한 확인'],
            [/자동결제|결제/, '결제일·금액 확인'],
            [/갱신/, '갱신일 확인'],
            [/환불|취소/, '환불·취소 조건 확인'],
            [/무료체험/, '체험 종료 전 해지'],
            [/마감|까지|만료|종료/, '기한 내 처리'],
            [/위약|약정/, '위약금·약정 기간 확인']
        ];
        const CATS = [
            ['멤버십·구독', /해지|구독|멤버십|갱신|자동결제|무료체험|약정/],
            ['앱테크', /앱테크|포인트|캐시|리워드|출석|적립|코인|룰렛|만보기/],
            ['쇼핑·생활', /쿠폰|할인|최저가|구매|배송|장바구니|쇼핑|생활|특가/]
        ];

        function normUrl(u) {
            try {
                const x = new URL(u);
                x.hash = '';
                [...x.searchParams.keys()].forEach((k) => { if (/^utm_/i.test(k)) x.searchParams.delete(k); });
                let s = x.href;
                if (s.endsWith('/')) s = s.slice(0, -1);
                return s.toLowerCase();
            } catch { return String(u).toLowerCase(); }
        }

        function parseNote(raw) {
            const urls = uniq((raw.match(URL_RE) || []).map((u) => u.replace(/[.,;]+$/, '')));
            const tags = uniq([...raw.matchAll(TAG_RE)].map((m) => m[1].trim()));
            const text = raw.replace(URL_RE, ' ').replace(TAG_RE, ' ').replace(/\s+/g, ' ').trim();

            const benefits = uniq([
                ...[...raw.matchAll(BENEFIT_RE)].map((m) => m[0].replace(/\s+/g, '')),
                ...(raw.match(BENEFIT_WORDS) || [])
            ]);
            let deadlines = [];
            DATE_RES.forEach((re) => { deadlines.push(...(raw.match(re) || []).map((s) => s.trim())); });
            deadlines = uniq(deadlines);
            const flags = FLAG_KEYS.filter((k) => raw.includes(k));
            const checks = uniq(CHECKS.filter(([re]) => re.test(raw)).map(([, label]) => label));

            let category = '북마크';
            const tagHit = CATS.find(([name]) => tags.some((t) => name.includes(t) || t.includes(name.split('·')[0])));
            if (tagHit) category = tagHit[0];
            else { const hit = CATS.find(([, re]) => re.test(raw)); if (hit) category = hit[0]; }

            let host = '';
            try { host = new URL(urls[0]).hostname.replace(/^www\./, ''); } catch {}
            const base = text || tags.join(' ') || host || '(내용 없음)';
            return {
                id: newId(),
                key: urls.length ? 'U:' + normUrl(urls[0]) : 'T:' + text.toLowerCase().replace(/\s+/g, ''),
                raw, category, tags, urls, benefits, deadlines, flags, checks,
                title: base.length > 48 ? base.slice(0, 48) + '…' : base,
                summary: base.length > 110 ? base.slice(0, 110) + '…' : base,
                done: false, createdAt: Date.now()
            };
        }

        function allNoteKeys() {
            const s = new Set();
            widgets.forEach((w) => { if (w.type === 'vault') (w.notes || []).forEach((n) => s.add(n.key)); });
            return s;
        }

        function addLinesTo(widget, lines) {
            const seen = allNoteKeys();
            let added = 0, dup = 0;
            for (const l of lines) {
                const line = String(l).trim();
                if (line.length < 2) continue;
                const n = parseNote(line);
                if (seen.has(n.key)) { dup++; continue; }
                seen.add(n.key); widget.notes.unshift(n); added++;
            }
            return { added, dup };
        }

        /* ---------- 입력 정규화 (텍스트 / 북마크 HTML / JSON / RSS) ---------- */
        function htmlToLines(html) {
            const doc = new DOMParser().parseFromString(html, 'text/html');
            return [...doc.querySelectorAll('a[href]')].map((a) => `${a.textContent.trim()} ${a.href}`);
        }
        function jsonToLines(d) {
            const arr = Array.isArray(d) ? d
                : (d.items || d.bookmarks || d.data || d.entries || Object.values(d).find(Array.isArray) || []);
            return arr.map((x) => {
                if (typeof x === 'string') return x;
                if (!x || typeof x !== 'object') return '';
                const t = x.title || x.name || x.text || x.label || '';
                const u = x.url || x.link || x.href || '';
                const e = x.description || x.summary || x.memo || x.note || x.content || '';
                const tg = Array.isArray(x.tags) ? x.tags.map((s) => `[${s}]`).join(' ') : '';
                return [tg, t, e, u].filter(Boolean).join(' ');
            });
        }
        function xmlToLines(xml) {
            const doc = new DOMParser().parseFromString(xml, 'application/xml');
            if (doc.querySelector('parsererror')) return [];
            return [...doc.querySelectorAll('item, entry')].map((n) => {
                const g = (sel) => (n.querySelector(sel)?.textContent || '').trim();
                const link = g('link') || n.querySelector('link')?.getAttribute('href') || '';
                const desc = (g('description') || g('summary') || g('content')).replace(/<[^>]+>/g, ' ');
                return [g('title'), desc, link].filter(Boolean).join(' ');
            });
        }
        function textToLines(text) {
            if (/<a\s[^>]*href/i.test(text)) return htmlToLines(text);
            return text.split(/\r?\n/).map((l) => l.replace(/\t/g, ' '));
        }

        /* ---------- 백업 / 복원 ---------- */
        function exportBackup() {
            const blob = new Blob([JSON.stringify({ app: 'startpage-vault', v: 1, exportedAt: new Date().toISOString(), widgets }, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `startpage-backup-${new Date().toISOString().slice(0, 10).replace(/-/g, '')}.json`;
            a.click(); URL.revokeObjectURL(a.href);
        }

        function cleanWidgets(arr) {
            if (!Array.isArray(arr)) return [];
            return arr.filter((w) => w && WIDGET_TYPES.includes(w.type)).map((w) => {
                if (w.type === 'vault') {
                    const notes = (w.notes || []).filter((n) => n && typeof n.raw === 'string').map((n) => {
                        const x = parseNote(n.raw); x.done = !!n.done; return x;   // 원문에서 다시 파싱: 외부 데이터 신뢰 안 함
                    });
                    return { type: 'vault', title: String(w.title || 'VAULT'), notes, hideDone: !!w.hideDone };
                }
                return w;
            });
        }

        function importBackup(d) {
            const incoming = cleanWidgets(d.widgets);
            const replace = confirm('확인 = 현재 대시보드를 백업으로 교체\n취소 = 병합 (중복 노트 제외)');
            if (replace) { widgets = incoming; save(); renderWidgets(); return '교체 완료: 위젯 ' + widgets.length + '개'; }
            const seen = allNoteKeys();
            let notes = 0;
            incoming.forEach((w) => {
                if (w.type === 'vault') {
                    w.notes = w.notes.filter((n) => { if (seen.has(n.key)) return false; seen.add(n.key); return true; });
                    notes += w.notes.length;
                }
                widgets.push(w);
            });
            save(); renderWidgets();
            return `병합 완료: 위젯 ${incoming.length}개, 새 노트 ${notes}건`;
        }

        async function ingestBody(body, widget) {
            const s = body.trim();
            if (s.startsWith('{') || s.startsWith('[')) {
                const d = JSON.parse(s);
                if (d && d.app === 'startpage-vault' && Array.isArray(d.widgets)) return importBackup(d);
                const r = addLinesTo(widget, jsonToLines(d)); save(); renderWidgets();
                return `추가 ${r.added}건 · 중복 제외 ${r.dup}건`;
            }
            const lines = /^<\?xml|<rss|<feed/i.test(s.slice(0, 300)) ? xmlToLines(s) : textToLines(s);
            const r = addLinesTo(widget, lines); save(); renderWidgets();
            return `추가 ${r.added}건 · 중복 제외 ${r.dup}건`;
        }

        function getVaultWidget() {
            let w = widgets[vaultTarget];
            if (!w || w.type !== 'vault') {
                w = widgets.find((x) => x.type === 'vault');
                if (!w) { w = { type: 'vault', title: 'VAULT', notes: [] }; widgets.push(w); }
            }
            return w;
        }

        $('fileImport').addEventListener('change', async (e) => {
            const f = e.target.files[0]; if (!f) return;
            try {
                vaultTarget = null;
                const msg = await ingestBody(await f.text(), getVaultWidget());
                toast(msg);
            } catch (err) { toast('가져오기 실패: ' + err.message); }
            e.target.value = '';
        });

        /* ---------- 요약노트 모달 ---------- */
        function openVaultModal(index) {
            vaultTarget = index;
            $('vaultPaste').value = ''; $('vaultUrl').value = ''; $('vaultStatus').textContent = '';
            $('vaultModal').classList.add('active');
        }
        function closeVaultModal() { $('vaultModal').classList.remove('active'); }

        async function vaultSubmit() {
            const text = $('vaultPaste').value;
            if (!text.trim()) { $('vaultStatus').textContent = '붙여넣은 내용이 없습니다.'; return; }
            try {
                $('vaultStatus').textContent = await ingestBody(text, getVaultWidget());
                $('vaultPaste').value = '';
            } catch (e) { $('vaultStatus').textContent = '실패: ' + e.message; }
        }

        async function vaultFetchUrl() {
            const url = $('vaultUrl').value.trim();
            if (!/^https?:\/\//i.test(url) && !/^[\w./-]+\.(json|xml|rss)$/i.test(url)) { $('vaultStatus').textContent = '주소 형식이 올바르지 않습니다.'; return; }
            $('vaultStatus').textContent = '불러오는 중...';
            try {
                const res = await fetch(url, { cache: 'no-store' });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                $('vaultStatus').textContent = await ingestBody(await res.text(), getVaultWidget());
            } catch (e) {
                $('vaultStatus').textContent = '불러오기 실패: ' + e.message + ' (다른 도메인은 CORS로 막힐 수 있음 → 내용을 열어 복사해 붙여넣기)';
            }
        }

        /* ---------- 렌더 ---------- */
        function noteHTML(n, wi) {
            const chips = (a) => a.map((x) => `<span class="chip">${esc(x)}</span>`).join('');
            const cond = [...(n.benefits || []), ...(n.tags || []).filter((t) => !String(n.category).includes(t))];
            const links = (n.urls || []).map((u) => {
                const s = safeUrl(u);
                return s ? `<a href="${esc(s)}" target="_blank" rel="noopener noreferrer">${esc(s.replace(/^https?:\/\/(www\.)?/, '').slice(0, 50))}</a>` : '';
            }).join('');
            const dl = n.deadlines || [], fl = n.flags || [], ck = n.checks || [];
            return `
            <div class="note ${n.done ? 'done' : ''}">
                <div class="note-top">
                    <input type="checkbox" data-vact="done" data-w="${wi}" data-n="${esc(n.id)}" ${n.done ? 'checked' : ''} aria-label="완료">
                    <div class="note-main"><div class="note-title">${esc(n.title)}</div><div class="note-cat">${esc(n.category)}</div></div>
                    <button class="note-del" data-vact="del" data-w="${wi}" data-n="${esc(n.id)}" title="삭제">×</button>
                </div>
                <div class="nsec s1"><span class="lab">핵심 요약</span><span class="txt">${esc(n.summary)}</span></div>
                <div class="nsec s2"><span class="lab">혜택·수치·조건</span>
                    ${cond.length ? `<div class="chips">${chips(cond)}</div>` : '<span class="txt none">없음</span>'}</div>
                <div class="nsec s3"><span class="lab">기한·해지·체크</span>
                    ${dl.length ? `<div class="chips">${chips(dl)}</div>` : ''}
                    ${fl.length ? `<div class="chips">${chips(fl)}</div>` : ''}
                    ${ck.length ? `<ul class="chk">${ck.map((c) => `<li>${esc(c)}</li>`).join('')}</ul>` : ''}
                    ${!dl.length && !fl.length && !ck.length ? '<span class="txt none">없음</span>' : ''}</div>
                ${links ? `<div class="note-links">${links}</div>` : ''}
            </div>`;
        }

        function renderWidgets() {
            const grid = $('dashboardGrid');
            grid.innerHTML = '';

            widgets.forEach((widget, index) => {
                const card = document.createElement('div');
                const isGallery = widget.type === 'gallery';
                card.className = isGallery ? 'widget-card gallery-mode' : 'widget-card';

                let headerHTML = `
                    <div class="widget-header">
                        <input type="text" class="widget-title-input" value="${esc(widget.title || widget.type.toUpperCase())}" onchange="updateWidgetTitle(${index}, this.value)">
                        <div class="widget-controls">
                `;

                if (widget.type === 'bookmark' || widget.type === 'gallery') {
                    headerHTML += `<button class="widget-add-sub" onclick="openSubModal(${index})">+</button>`;
                }
                if (widget.type === 'vault') {
                    headerHTML += `<button class="widget-add-sub" onclick="openVaultModal(${index})" title="붙여넣기">+</button>`;
                }

                headerHTML += `
                            <button class="widget-delete" onclick="deleteWidget(${index})">×</button>
                        </div>
                    </div>
                `;

                if (widget.type === 'bookmark') {
                    let itemsHTML = (widget.items || []).map((item, itemIdx) => {
                        const u = safeUrl(item.url);
                        return `
                        <div class="bookmark-item">
                            <a href="${esc(u)}" target="_blank" rel="noopener noreferrer" class="bookmark-info" style="flex:1;" title="${esc(u)}">
                                <img src="https://www.google.com/s2/favicons?domain=${encodeURIComponent(u)}&sz=32" onerror="${HIDE_IMG}">
                                <span class="bookmark-name">${esc(item.title || item.url)}</span>
                            </a>
                            <div class="bookmark-actions">
                                <button class="action-icon-btn" onclick="editBookmarkTitle(${index}, ${itemIdx})" title="Edit name">✏️</button>
                                <button class="action-icon-btn" onclick="deleteBookmarkItem(${index}, ${itemIdx})" title="Delete">❌</button>
                            </div>
                        </div>`;
                    }).join('');
                    card.innerHTML = headerHTML + `<div class="bookmark-list">${itemsHTML}</div>`;
                }
                else if (widget.type === 'memo') {
                    card.innerHTML = headerHTML + `
                        <div class="memo-toolbar">
                            <button onclick="formatMemo('bold')"><b>B</b></button>
                            <button onclick="formatMemo('underline')"><u>U</u></button>
                            <button onclick="formatMemo('fontSize', '5')">Bigger</button>
                            <button onclick="formatMemo('fontSize', '3')">Default</button>
                            <input type="color" onchange="formatMemo('foreColor', this.value)" title="Text color">
                        </div>
                        <div class="memo-editable" contenteditable="true" oninput="updateMemo(${index}, this.innerHTML)">${sanitizeHtml(widget.content || '')}</div>
                    `;
                }
                else if (widget.type === 'youtube') {
                    const vid = /^[\w-]{6,20}$/.test(widget.videoId || '') ? widget.videoId : '';
                    card.innerHTML = headerHTML + (vid ? `
                        <div class="youtube-container">
                            <iframe src="https://www.youtube.com/embed/${vid}?autoplay=1&mute=1&loop=1&controls=0&playlist=${vid}" allow="autoplay; encrypted-media" allowfullscreen></iframe>
                        </div>` : '<div class="vault-empty">잘못된 영상 ID</div>');
                }
                else if (widget.type === 'gallery') {
                    let imagesHTML = (widget.images || []).map((imgUrl, imgIdx) => `
                        <div class="gallery-item">
                            <img src="${esc(safeImg(imgUrl))}" onerror="${HIDE_IMG}">
                            <button class="widget-delete-img" onclick="deleteGalleryItem(${index}, ${imgIdx})" title="Delete photo">×</button>
                        </div>
                    `).join('');
                    card.innerHTML = headerHTML + `<div class="gallery-grid">${imagesHTML}</div>`;
                }
                else if (widget.type === 'rss') {
                    let rssHTML = (widget.items || []).map((item) => `
                        <a href="${esc(safeUrl(item.link))}" target="_blank" rel="noopener noreferrer" class="rss-item">${esc(item.title)}</a>
                    `).join('') || '<div style="font-size:13px; opacity:0.6;">Loading RSS...</div>';
                    card.innerHTML = headerHTML + `<div class="rss-list">${rssHTML}</div>`;
                }
                else if (widget.type === 'vault') {
                    const notes = widget.notes || [];
                    const shown = widget.hideDone ? notes.filter((n) => !n.done) : notes;
                    const sorted = [...shown].sort((a, b) => Number(a.done) - Number(b.done) || (b.createdAt || 0) - (a.createdAt || 0));
                    card.innerHTML = headerHTML + `
                        <div class="vault-bar">
                            <button onclick="toggleHideDone(${index})">${widget.hideDone ? '완료 보기' : '완료 숨기기'}</button>
                            <button onclick="purgeDone(${index})">완료 삭제</button>
                            <span class="vcount">${shown.length} / ${notes.length}</span>
                        </div>
                        <div class="vault-list">${sorted.map((n) => noteHTML(n, index)).join('') || '<div class="vault-empty">노트가 없습니다. 헤더의 +로 붙여넣으세요.</div>'}</div>
                    `;
                }

                grid.appendChild(card);
            });
        }

        /* 요약노트 카드 이벤트 (data 속성 기반 위임) */
        $('dashboardGrid').addEventListener('click', (e) => {
            const t = e.target.closest('[data-vact]'); if (!t) return;
            const w = widgets[Number(t.dataset.w)];
            if (!w || w.type !== 'vault') return;
            const n = (w.notes || []).find((x) => x.id === t.dataset.n);
            if (!n) return;
            if (t.dataset.vact === 'done') { n.done = t.checked; }
            else if (t.dataset.vact === 'del') {
                if (!confirm('삭제할까요?')) return;
                w.notes = w.notes.filter((x) => x.id !== n.id);
            }
            save(); renderWidgets();
        });

        function toggleHideDone(index) { widgets[index].hideDone = !widgets[index].hideDone; save(); renderWidgets(); }
        function purgeDone(index) {
            const w = widgets[index]; const c = (w.notes || []).filter((n) => n.done).length;
            if (!c || !confirm(`완료 노트 ${c}건을 삭제할까요?`)) return;
            w.notes = w.notes.filter((n) => !n.done); save(); renderWidgets();
        }

        /* ---------- 테마 ---------- */
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('theme_v2', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
        }
        if (localStorage.getItem('theme_v2') === 'dark') {
            document.body.classList.add('dark-mode');
        }

        /* ---------- 위젯 조작 (기존 기능) ---------- */
        function updateWidgetTitle(index, title) {
            widgets[index].title = title;
            save();
        }

        function formatMemo(command, value = null) {
            document.execCommand(command, false, value);
        }

        function addWidgetModal(type) {
            if (type === 'memo') {
                widgets.push({ type: 'memo', title: 'MEMO', content: '' });
                save(); renderWidgets();
                return;
            }
            if (type === 'vault') {
                widgets.push({ type: 'vault', title: 'VAULT', notes: [] });
                save(); renderWidgets();
                return;
            }
            modalState = { type: type, targetIndex: null };
            $('commonModal').classList.add('active');
            const placeholders = {
                bookmark: 'Enter bookmark URL (e.g. https://naver.com)',
                youtube: 'Enter YouTube link or video ID',
                gallery: 'Enter image URL',
                rss: 'Enter RSS feed URL'
            };
            $('modalInput').value = '';
            $('modalInput').placeholder = placeholders[type] || '';
            $('modalTitle').innerText = 'Add ' + type.toUpperCase();
        }

        function openSubModal(index) {
            modalState = { type: 'sub_add', targetIndex: index };
            $('commonModal').classList.add('active');
            const widgetType = widgets[index].type;
            $('modalInput').value = '';
            $('modalInput').placeholder = widgetType === 'bookmark' ? 'Enter URL to add' : 'Enter image URL to add';
            $('modalTitle').innerText = widgetType === 'bookmark' ? 'Add bookmark item' : 'Add moodboard image';
        }

        function closeModal() { $('commonModal').classList.remove('active'); }

        function normalizeUrl(val) {
            let url = val;
            if (!url.startsWith('http://') && !url.startsWith('https://')) url = 'https://' + url;
            const parsed = new URL(url);
            return { url: url, title: parsed.hostname.replace('www.', '') };
        }

        async function submitModal() {
            const val = $('modalInput').value.trim();
            if (!val) return;

            if (modalState.targetIndex !== null) {
                const widget = widgets[modalState.targetIndex];
                if (widget.type === 'bookmark') {
                    try { widget.items.push(normalizeUrl(val)); save(); renderWidgets(); }
                    catch (e) { alert('Not a valid URL.'); return; }
                } else if (widget.type === 'gallery') {
                    if (!safeImg(val)) { alert('http(s) 이미지 주소만 가능합니다.'); return; }
                    widget.images.push(val); save(); renderWidgets();
                }
            } else {
                if (modalState.type === 'bookmark') {
                    try { widgets.push({ type: 'bookmark', title: 'BOOKMARK', items: [normalizeUrl(val)] }); save(); renderWidgets(); }
                    catch (e) { alert('Not a valid URL.'); return; }
                } else if (modalState.type === 'youtube') {
                    const m = val.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{6,20})/);
                    const videoId = m ? m[1] : (/^[\w-]{6,20}$/.test(val) ? val : '');
                    if (!videoId) { alert('영상 링크 또는 ID를 확인하세요.'); return; }
                    widgets.push({ type: 'youtube', title: 'YOUTUBE', videoId: videoId });
                    save(); renderWidgets();
                } else if (modalState.type === 'gallery') {
                    if (!safeImg(val)) { alert('http(s) 이미지 주소만 가능합니다.'); return; }
                    widgets.push({ type: 'gallery', title: 'MOODBOARD', images: [val] });
                    save(); renderWidgets();
                } else if (modalState.type === 'rss') {
                    const w = { type: 'rss', title: 'RSS FEED', feedUrl: val, items: [] };
                    widgets.push(w); save(); renderWidgets();
                    fetchRssFeed(w, val);
                }
            }

            closeModal();
        }

        function editBookmarkTitle(wIdx, iIdx) {
            const currentTitle = widgets[wIdx].items[iIdx].title;
            const newTitle = prompt('Enter a new bookmark title:', currentTitle);
            if (newTitle !== null && newTitle.trim() !== '') {
                widgets[wIdx].items[iIdx].title = newTitle.trim();
                save(); renderWidgets();
            }
        }

        // 직접 fetch(+XML 파싱) 먼저, CORS로 막히면 rss2json으로 대체
        async function fetchRssFeed(widget, rssUrl) {
            try {
                const res = await fetch(rssUrl);
                const doc = new DOMParser().parseFromString(await res.text(), 'application/xml');
                if (doc.querySelector('parsererror')) throw new Error('xml');
                const its = [...doc.querySelectorAll('item, entry')].slice(0, 30).map((n) => ({
                    title: (n.querySelector('title')?.textContent || '').trim(),
                    link: (n.querySelector('link')?.textContent || n.querySelector('link')?.getAttribute('href') || '').trim()
                }));
                if (!its.length) throw new Error('empty');
                widget.items = its; persistLocal(); renderWidgets();
                return;
            } catch (e) { /* fallthrough */ }
            try {
                const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`);
                const data = await res.json();
                if (data.status === 'ok') {
                    widget.items = data.items.map((item) => ({ title: item.title, link: item.link }));
                    persistLocal(); renderWidgets();
                }
            } catch (err) {
                console.error('Failed to load RSS feed');
            }
        }

        function updateMemo(index, htmlContent) {
            widgets[index].content = htmlContent;
            save();
        }

        function deleteWidget(index) { widgets.splice(index, 1); save(); renderWidgets(); }
        function deleteBookmarkItem(widgetIdx, itemIdx) { widgets[widgetIdx].items.splice(itemIdx, 1); save(); renderWidgets(); }
        function deleteGalleryItem(widgetIdx, imgIdx) { widgets[widgetIdx].images.splice(imgIdx, 1); save(); renderWidgets(); }

        /* ---------- 인증 모듈이 호출하는 진입점 ---------- */
        window.App = {
            async onLogin(user, cloudApi) {
                cloud = cloudApi || null;
                loadLocal();
                if (cloud) {
                    try {
                        const c = await cloud.load();
                        const localTs = Number(localStorage.getItem(LS_TS) || 0);
                        if (c && c.ts > localTs) {
                            widgets = cleanWidgets(JSON.parse(c.data));
                            persistLocal(); localStorage.setItem(LS_TS, String(c.ts));
                        } else if (widgets.length) {
                            save();
                        }
                    } catch (e) { toast('Firestore 불러오기 실패: ' + e.message); }
                }
                $('gate').hidden = true;
                $('app').hidden = false;
                $('who').textContent = user.email;
                renderWidgets();
                widgets.forEach((w) => { if (w.type === 'rss' && w.feedUrl) fetchRssFeed(w, w.feedUrl); });
            },
            onLock(msg) {
                widgets = []; cloud = null;
                $('dashboardGrid').innerHTML = '';
                $('vaultPaste').value = '';
                closeModal(); closeVaultModal();
                $('app').hidden = true;
                $('gate').hidden = false;
                if (msg !== undefined) $('gateMsg').textContent = msg;
            }
        };
    </script>

            ]);
            const app = initializeApp(FIREBASE_CONFIG);

            let cloudApi = null;
            if (USE_FIRESTORE) {
                const fs = await import(FB + "firebase-firestore.js");
                const db = fs.getFirestore(app);
                const ref = fs.doc(db, "startpage", "main");
                cloudApi = {
                    async load() {
                        const s = await fs.getDoc(ref);
                        return s.exists() ? { data: s.data().data, ts: s.data().updatedAt } : null;
                    },
                    save(data, ts) { return fs.setDoc(ref, { data, updatedAt: ts }); }
                };
            }

                    await am.signOut(auth);
                    return;
                }
                await window.App.onLogin(user, cloudApi);
            });
        }
